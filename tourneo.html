function panneauEpreuve(x){
  var nbPart = Math.max(x.participants.length, E.joueurs.length, 2);
  var bareme = (x.baremeManuel && x.baremeManuel.length) ? x.baremeManuel : barmeAutoPour(nbPart);
  var i = E.epreuves.indexOf(x);

  var h = '<div class="rangee entre" style="align-items:flex-end">'+
    entete("Réglages", "Ce jeu en <em>détail</em>.")+
    '<button class="btn mini" data-act="fermer-epreuve" style="margin-bottom:18px">Retour</button></div>';

  h += '<div class="carte"><div class="rangee" style="gap:11px;margin-bottom:13px">'+ blason(x, 30)+
    '<input type="text" value="'+esc(x.nom)+'" data-act="ep-nom" data-ep="'+x.id+'" data-focus="en-'+x.id+'" aria-label="Nom du jeu">'+
    '</div><div class="duo">'+
    '<label class="champ"><span class="nom">Poids</span>'+
    '<input type="number" step="any" min="0" value="'+esc(x.poids)+'" data-act="ep-poids" data-ep="'+x.id+'" data-focus="ep-'+x.id+'">'+
    '<span class="aide">Multiplie les points de ce jeu. Les flèches avancent d\'un cran ; les décimales restent permises au clavier.</span></label>'+
    '<label class="champ"><span class="nom">Plusieurs manches</span>'+
    '<select data-act="ep-cumul" data-ep="'+x.id+'">'+
      '<option value="somme"'+(x.cumul==="somme"?" selected":"")+'>Additionner les manches</option>'+
      '<option value="moyenne"'+(x.cumul==="moyenne"?" selected":"")+'>Moyenne des manches</option></select>'+
    '<span class="aide">'+(x.cumul==="somme"
      ? 'Trois manches rapportent trois fois plus qu\'un jeu unique — la durée est récompensée.'
      : 'Le jeu garde le même poids quel que soit le nombre de manches ; la chance est lissée.')+'</span></label></div>';

  h += '<label class="champ"><span class="nom">Barème</span>'+
    '<select data-act="ep-mode" data-ep="'+x.id+'">'+
      '<option value="auto"'+(x.mode==="auto"?" selected":"")+'>Automatique (normalisé)</option>'+
      '<option value="manuel"'+(x.mode==="manuel"?" selected":"")+'>Manuel (points par position)</option></select>'+
    '<span class="aide">'+(x.mode==="auto"
      ? 'Points = '+esc(E.reglages.ptsBase)+' + '+esc(E.reglages.ptsEtendue)+' &#215; (N &#8722; rang) &#247; (N &#8722; 1)'+
        (E.reglages.pointsEntiers ? ', arrondi au point.' : '.')
      : 'Vous fixez vous-même la valeur de chaque position.')+'</span></label>';

  if (x.mode === "manuel"){
    h += '<div class="etiq" style="margin-bottom:7px">Points par position</div><div class="grille-bareme">';
    for (var r=1; r<=bareme.length; r++){
      h += '<div><label for="bm-'+x.id+'-'+r+'">'+r+(r===1?"er":"e")+' place</label>'+
        '<input id="bm-'+x.id+'-'+r+'" type="number" step="any" value="'+esc(bareme[r-1])+'" '+
        'data-act="ep-bareme" data-ep="'+x.id+'" data-r="'+r+'" data-focus="bm-'+x.id+'-'+r+'"></div>';
    }
    h += '</div><div class="rangee" style="gap:8px;margin-top:10px;flex-wrap:wrap">'+
      '<button class="btn mini" data-act="bareme-auto" data-ep="'+x.id+'">Remplir depuis la formule</button>'+
      '<button class="btn mini" data-act="bareme-plus" data-ep="'+x.id+'">Ajouter une position</button>'+
      '<button class="btn mini" data-act="bareme-moins" data-ep="'+x.id+'">Retirer la dernière</button></div>'+
      '<div class="petit sourdine" style="margin-top:8px">Les flèches montent par point entier. Tapez 6,5 si vous voulez une demie.</div>';
  }
  h += '</div>';

  h += '<div class="carte"><div class="etiq" style="margin-bottom:9px">Pictogramme</div><div class="grille-icones">'+
    Object.keys(ICONES).map(function(k){
      return '<button class="puce-icone'+(x.icone===k && !x.image?' actif':'')+'" data-act="ep-icone" data-ep="'+x.id+
             '" data-i="'+k+'" aria-label="'+k+'">'+
             (APERCUS[k] ? '<img src="'+esc(APERCUS[k])+'" alt="" loading="lazy">' : svgIcone(k,22))+'</button>';
    }).join("")+'</div>'+
    '<div class="rangee" style="gap:10px;margin-top:14px;flex-wrap:wrap">'+
      '<label class="rangee" style="gap:9px;flex:0 0 auto"><span class="petit sourdine">Teinte</span>'+
      '<input type="color" value="'+esc(x.teinte)+'" data-act="ep-teinte" data-ep="'+x.id+'" aria-label="Teinte du jeu"></label>'+
      '<button class="btn mini" data-act="ep-image-choisir" data-ep="'+x.id+'">'+(x.image?'Remplacer l\'image':'Utiliser une image')+'</button>'+
      (x.image ? '<button class="btn mini lien" data-act="ep-image-vider" data-ep="'+x.id+'">Revenir au pictogramme</button>' : '')+
      '<input type="file" accept="image/*" data-act="ep-image" data-ep="'+x.id+'" id="img-'+x.id+'" hidden></div>'+
    '<div class="petit sourdine" style="margin-top:9px">L\'image est recadrée en carré de 128&nbsp;px et stockée dans ce navigateur. '+
    'Utilisez vos propres visuels : les jaquettes officielles sont protégées par le droit d\'auteur.</div></div>';

  h += '<div class="carte"><div class="rangee" style="gap:8px;flex-wrap:wrap">'+
    '<button class="btn mini" data-act="ep-monte" data-ep="'+x.id+'"'+(i===0?' disabled':'')+'>&#8593; Plus tôt</button>'+
    '<button class="btn mini" data-act="ep-descend" data-ep="'+x.id+'"'+(i===E.epreuves.length-1?' disabled':'')+'>&#8595; Plus tard</button>'+
    '<button class="btn mini danger pousse" data-act="ep-retire" data-ep="'+x.id+'">Supprimer ce jeu</button></div></div>';
  return h;
}

/* ---------- Vue : classement ---------- */
function vueClassement(){
  var h = '<div class="segments">'+
    '<button data-act="onglet-rang" data-v="soir" aria-pressed="'+(ongletRang==="soir")+'">Ce soir</button>'+
    '<button data-act="onglet-rang" data-v="ligue" aria-pressed="'+(ongletRang==="ligue")+'">La ligue</button></div>';
  return h + (ongletRang === "ligue" ? vueLigue() : vueCeSoir());
}

function vueCeSoir(){
  if (!E.joueurs.length){
    return '<div class="carte"><div class="vide-etat"><strong>Personne autour du feu.</strong>'+
      'Ajoutez les personnes présentes dans l\'onglet Joueurs, puis choisissez vos jeux.'+
      '<div style="margin-top:18px"><button class="btn primaire" data-act="exemple">Soirée d\'exemple</button></div></div></div>';
  }

  var aveugle = estAveugle();
  var h = "";

  if (aveugle){
    var reste = epreuvesRestantes();
    h += '<div class="scelle"><div class="sceau">&#9878;</div>'+
      '<strong>Classement scellé</strong>'+
      '<p>Il reste '+reste+' jeu'+(reste>1?'x':'')+'. Les points continuent d\'être comptés, mais personne ne voit '+
      'où il en est — ni sur les téléphones, ni sur le téléviseur. Le classement se révélera à la fin.</p>'+
      '<button class="btn primaire" data-act="reveler">Briser le sceau maintenant</button></div>';
  } else {
    var cl = classement();
    var tete = cl.length ? cl[0].total : 0;
    var mv = mouvements();
    var hc = horsCourse(cl);

    h += entete("Ce soir", "Qui <em>mène</em>.");
    if (mv) h += '<div class="carte mince petit sourdine" style="margin-bottom:9px">Les flèches montrent le mouvement provoqué par <strong style="color:var(--texte)">'+esc(mv.epreuve.nom)+'</strong>.</div>';

    h += cl.map(function(r,i){
      var largeur = tete > 0 ? Math.max(0,(r.total/tete)*100) : 0;
      var d = mv ? (mv.rangAvant[r.joueur.id] - (i+1)) : null;
      var ecart = i === 0 ? null : arrondir(tete - r.total);
      return '<div class="ligne-classement'+(i===0 && r.total>0?' tete':'')+(hc[r.joueur.id]?' horscourse':'')+'">'+
        '<div class="jauge" style="width:'+largeur+'%"></div>'+
        '<span class="place chiffre">'+(i+1)+'</span>'+ jeton(r.joueur.id)+
        '<span class="bloc-nom"><span class="nom">'+esc(r.joueur.nom)+'</span><span class="sous">'+ badgeDelta(d)+
          (ecart !== null && ecart > 0 ? '<span class="chiffre">&#8722;'+fmt(ecart)+' du meneur</span>' : '')+
          (r.departage ? '<span style="color:var(--laiton)">devance '+esc(r.departage.sur)+' '+esc(r.departage.long)+'</span>' : '')+
          (hc[r.joueur.id] ? '<span class="pastille horscourse">hors course</span>' : '')+
        '</span></span><span class="total">'+fmt(r.total)+'</span></div>';
    }).join("");

    var restePts = pointsRestants();
    if (restePts > 0 && E.epreuves.some(function(x){ return calculerEpreuve(x).classee; }))
      h += '<div class="petit sourdine" style="margin-top:5px">Il reste au maximum '+fmt(restePts)+' points à distribuer.</div>';
  }

  // Cercles d'équipe : ne révèlent aucun total, visibles même sous sceau.
  if (E.reglages.plafondActif && Number(E.reglages.plafondPartenaires) > 0){
    h += entete("Alliances", "Qui <em>suit</em> qui.");
    h += '<div class="carte mince petit sourdine" style="margin-bottom:10px">Chaque joueur peut faire équipe avec '+
      esc(E.reglages.plafondPartenaires)+' personne'+(E.reglages.plafondPartenaires>1?'s':'')+' au maximum ce soir'+
      (E.reglages.plafondBidirectionnel ? ' — porter quelqu\'un consomme un lien des deux côtés.' : '.')+'</div>';
    h += E.joueurs.slice().sort(function(a,b){ return a.nom.localeCompare(b.nom,"fr"); }).map(function(j){
      var p = partenairesDe(j.id);
      var libres = Math.max(0, Number(E.reglages.plafondPartenaires) - p.length);
      return '<div class="carte mince rangee" style="gap:10px">'+ jeton(j.id)+
        '<span style="font-weight:650;font-size:.89rem;min-width:78px">'+esc(j.nom)+'</span>'+
        '<span class="cercle pousse">'+
          p.map(function(x){ return '<span class="lien">'+jeton(x)+esc(nomDe(x))+'</span>'; }).join("")+
          new Array(libres+1).join('<span class="encoche"></span>')+
          (p.length===0 && libres===0 ? '<span class="petit sourdine">aucun lien</span>' : '')+
        '</span></div>';
    }).join("");
  }

  var fs = faitsSaillants();
  if (fs.length){
    h += entete("Les moments", "Ce qui <em>restera</em>.")+'<div class="faits">'+
      fs.map(function(f){
        return '<div class="fait '+f.ton+'"><span class="etiq">'+esc(f.etiq)+'</span>'+
          '<div class="v">'+esc(f.v)+'</div><div class="q">'+esc(f.q)+'</div><div class="d">'+esc(f.d)+'</div></div>';
      }).join("")+'</div>';
  }

  var jouees = E.epreuves.filter(function(x){ return calculerEpreuve(x).classee; });
  if (jouees.length && !aveugle){
    var cl2 = classement();
    h += entete("Le détail", "Jeu par <em>jeu</em>.");
    h += '<div class="defile"><table class="matrice"><thead><tr><th>Joueur</th>'+
      jouees.map(function(x){
        return '<th>'+esc(x.nom)+(Number(x.poids)!==1?' <span class="sourdine">&#215;'+esc(x.poids)+'</span>':'')+'</th>';
      }).join("")+'<th>Total</th></tr></thead><tbody>'+
      cl2.map(function(r){
        return '<tr><td>'+esc(r.joueur.nom)+'</td>'+
          jouees.map(function(x){
            var d = r.detail[x.id];
            if (!d || d.pts === null) return '<td class="val vide">&middot;</td>';
            var suit = d.role === "suit";
            return '<td class="val'+(suit?' herite':'')+'" title="'+(suit?'Hérité de '+esc(nomDe(d.porteur)):'')+'">'+
              (suit?'&#8627;':'')+fmt(d.pts)+'</td>';
          }).join("")+'<td class="val tot">'+fmt(r.total)+'</td></tr>';
      }).join("")+'</tbody></table></div>'+
      '<div class="petit sourdine" style="margin-top:8px">&#8627; = points hérités d\'un porteur.</div>';
  }

  h += '<div class="carte" style="margin-top:16px"><div class="rangee" style="gap:9px;flex-wrap:wrap">'+
    '<button class="btn primaire" data-act="recap">Récapitulatif partageable</button>'+
    '<button class="btn" data-act="archiver">Clore et archiver la soirée</button></div>'+
    '<div class="petit sourdine" style="margin-top:9px">L\'archivage verse le classement dans la ligue, '+
    'puis efface les résultats en gardant les joueurs et les jeux pour la prochaine fois.</div></div>';
  return h;
}

function vueLigue(){
  var arch = lireArchives();
  var L = ligue(true);
  if (!L.length){
    return '<div class="carte"><div class="vide-etat"><strong>Aucune soirée archivée.</strong>'+
      'Archivez une première soirée depuis l\'onglet « Ce soir » et le cumul démarrera ici.</div></div>';
  }
  var tete = L[0].total;
  var h = entete("La ligue", "Le cumul des <em>soirées</em>.");
  h += '<div class="carte mince petit sourdine" style="margin-bottom:10px">'+
    arch.length+' soirée'+(arch.length>1?'s':'')+' archivée'+(arch.length>1?'s':'')+
    ', plus celle en cours. Le cumul se fait par nom : gardez les mêmes orthographes d\'une fois à l\'autre.</div>';

  h += L.map(function(r,i){
    var largeur = tete > 0 ? Math.max(0,(r.total/tete)*100) : 0;
    return '<div class="ligne-classement'+(i===0?' tete':'')+'">'+
      '<div class="jauge" style="width:'+largeur+'%"></div>'+
      '<span class="place chiffre">'+(i+1)+'</span>'+
      '<span class="bloc-nom"><span class="nom">'+esc(r.nom)+'</span><span class="sous">'+
        '<span class="chiffre">'+r.soirees+' soirée'+(r.soirees>1?'s':'')+'</span>'+
        (r.victoires ? '<span class="chiffre" style="color:var(--laiton)">'+r.victoires+' victoire'+(r.victoires>1?'s':'')+'</span>' : '')+
        (r.podiums ? '<span class="chiffre">'+r.podiums+' podium'+(r.podiums>1?'s':'')+'</span>' : '')+
      '</span></span><span class="total">'+fmt(r.total)+'</span></div>';
  }).join("");

  if (arch.length){
    h += entete("Les archives", "Ce qu'on a <em>déjà</em> joué.");
    h += arch.map(function(s){
      return '<div class="carte mince rangee" style="gap:10px">'+
        '<div style="flex:1;min-width:0"><div style="font-weight:650;font-size:.9rem">'+esc(s.nom)+'</div>'+
        '<div class="petit sourdine">'+esc(s.date)+' &middot; '+s.nbJeux+' jeu'+(s.nbJeux>1?'x':'')+
        ' &middot; vainqueur : '+esc(s.classement[0] ? s.classement[0].nom : "—")+'</div></div>'+
        '<button class="btn mini danger" data-act="archive-retire" data-a="'+s.id+'">Retirer</button></div>';
    }).join("");
  }
  return h;
}

/* ---------- Vue : déroulement ---------- */
function vueDeroulement(){
  if (!E.epreuves.length)
    return '<div class="carte"><div class="vide-etat"><strong>Rien au programme.</strong>'+
      'Choisissez vos jeux dans l\'onglet Jeux. Chacun devient une manche notée séparément.</div></div>';
  return E.epreuves.map(carteJeu).join("");
}

function carteJeu(x){
  var res = calculerEpreuve(x);
  var nbM = (x.manches||[]).length;

  var h = '<div class="carte" id="jeu-'+x.id+'"><div class="rangee" style="margin-bottom:12px;gap:11px">'+
    blason(x, 20, 'mini')+
    '<div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(x.nom)+'</div>'+
    '<div class="petit sourdine">'+(x.mode==="manuel"?"Barème manuel":"Barème automatique")+
      (Number(x.poids)!==1?" &middot; poids &#215;"+esc(x.poids):"")+
      (nbM>1 ? " &middot; "+(x.cumul==="moyenne"?"moyenne":"somme")+" de "+nbM+" manches" : "")+
      (E.reglages.chronoActif && x.debutA ? ' &middot; <span data-chrono="'+x.id+'">'+chronoTexte(x)+'</span>' : '')+
    '</div></div>'+
    '<span class="pastille etat '+x.statut+'">'+LIB_STATUT[x.statut]+'</span></div>';

  if (x.statut === "a_venir"){
    return h + '<p class="petit sourdine" style="margin:0 0 13px">Personne n\'a encore choisi son camp. '+
      'Ouvrez les déclarations quand le groupe est prêt.</p>'+
      '<button class="btn primaire" data-act="statut" data-ep="'+x.id+'" data-val="declarations">Ouvrir les déclarations</button></div>';
  }

  if (x.statut === "declarations"){
    h += '<div class="avis">Les affiliations et les paris se déclarent <strong>maintenant</strong>, avant que la partie commence. '+
         'Une fois le jeu lancé, tout est figé.</div>';
    h += '<div class="pile">' + E.joueurs.map(function(j){ return carteDeclaration(x, j); }).join("") + '</div>';
    var sans = E.joueurs.filter(function(j){ return roleDans(x, j.id) === "absent" && !x.paris[j.id]; });
    if (sans.length && E.reglages.affiliationObligatoire)
      h += '<div class="avis grave" style="margin-top:13px">Sans camp ni pari : '+
           sans.map(function(j){ return esc(j.nom); }).join(", ")+'. Ces joueurs marqueront 0 pour ce jeu.</div>';
    return h + '<div class="rangee" style="gap:9px;margin-top:14px;flex-wrap:wrap">'+
      '<button class="btn primaire" data-act="lancer" data-ep="'+x.id+'"'+(x.participants.length<1?' disabled':'')+'>Verrouiller et lancer</button>'+
      '<button class="btn lien" data-act="statut" data-ep="'+x.id+'" data-val="a_venir">Rouvrir la préparation</button></div></div>';
  }

  // Manches
  var iM = indexManche(x);
  var m = x.manches[iM];
  if (nbM > 1 || x.statut === "en_jeu"){
    h += '<div class="manches">' + x.manches.map(function(mm, k){
      return '<button class="manche" data-act="manche" data-ep="'+x.id+'" data-k="'+k+'" aria-pressed="'+(k===iM)+'">'+
        'Manche '+(k+1)+(mancheClassee(mm)?' <span class="ok">&#10003;</span>':'')+'</button>';
    }).join("") +
    (x.statut === "en_jeu"
      ? '<button class="manche ajout" data-act="manche-plus" data-ep="'+x.id+'">+ Manche</button>'+
        (nbM>1 ? '<button class="manche ajout" data-act="manche-moins" data-ep="'+x.id+'" data-k="'+iM+'">&#8722; Retirer</button>' : '')
      : '') + '</div>';
  }

  var parts = x.participants.slice().sort(function(a,b){
    var ra = m.rangs[a]||99, rb = m.rangs[b]||99;
    return ra - rb || nomDe(a).localeCompare(nomDe(b),"fr");
  });
  var N = parts.filter(function(p){ return m.rangs[p] > 0; }).length;

  h += '<div class="etiq" style="margin-bottom:8px">Ordre d\'arrivée &#8212; manche '+(iM+1)+' &#8212; touchez dans l\'ordre</div>';
  h += '<div class="pile">' + parts.map(function(p){
    var rang = m.rangs[p] || 0;
    var pts = res.parJoueur[p];
    var opts = ['<option value="0"'+(rang?"":" selected")+'>&#8212;</option>'];
    for (var r=1; r<=parts.length; r++) opts.push('<option value="'+r+'"'+(rang===r?" selected":"")+'>'+r+'</option>');
    return '<div class="rangee" style="gap:8px">'+
      '<button class="tuile-rang'+(rang?' classe':'')+'" data-act="rang-suivant" data-ep="'+x.id+'" data-j="'+p+'">'+
        '<span class="badge-rang'+(rang?'':' creux')+'">'+(rang||"&#8212;")+'</span>'+ jeton(p)+
        '<span class="nom">'+esc(nomDe(p))+'</span>'+
        (pts && pts.pts!==null ? '<span class="chiffre" style="color:var(--laiton);font-weight:700">'+fmt(pts.pts)+'</span>':'')+
      '</button>'+
      '<select style="width:74px;flex:0 0 auto" data-act="rang-select" data-ep="'+x.id+'" data-j="'+p+'" '+
      'aria-label="Rang de '+esc(nomDe(p))+'">'+opts.join("")+'</select></div>';
  }).join("") + '</div>';

  var suiveurs = Object.keys(x.affiliations);
  if (suiveurs.length){
    h += '<div class="etiq" style="margin:15px 0 8px">Affiliations verrouillées</div><div class="pile">'+
      suiveurs.map(function(a){
        var pts = res.parJoueur[a];
        return '<div class="tuile-suiveur">'+jeton(a)+
          '<span style="flex:1;min-width:0;font-weight:600;font-size:.9rem">'+esc(nomDe(a))+
          ' <span class="sourdine">suit</span> '+esc(nomDe(x.affiliations[a]))+'</span>'+
          (pts && pts.pts!==null ? '<span class="chiffre" style="color:var(--pervenche);font-weight:700">'+fmt(pts.pts)+'</span>':'')+
        '</div>';
      }).join("")+'</div>';
  }

  var parieurs = Object.keys(x.paris || {});
  if (parieurs.length && E.reglages.parisActifs){
    h += '<div class="etiq" style="margin:15px 0 8px">Paris de salon</div><div class="pile">'+
      parieurs.map(function(a){
        var v = res.parJoueur[a];
        var etat = !res.classee ? '' :
          (v && v.pariGagne ? '<span class="pastille jeu">gagné +'+fmt(v.gainPari)+'</span>' : '<span class="pastille absent">perdu</span>');
        return '<div class="tuile-suiveur paris">'+jeton(a)+
          '<span style="flex:1;min-width:0;font-weight:600;font-size:.9rem">'+esc(nomDe(a))+
          ' <span class="sourdine">mise sur</span> '+esc(nomDe(x.paris[a]))+'</span>'+etat+'</div>';
      }).join("")+'</div>';
  }

  h += '<div class="petit sourdine" style="margin-top:11px">'+N+' joueur'+(N>1?'s':'')+' classé'+(N>1?'s':'')+
       ' sur '+parts.length+' dans cette manche. Les égalités sont permises : donnez le même rang à deux joueurs.</div>';
  h += '<div class="rangee" style="gap:9px;margin-top:13px;flex-wrap:wrap">';
  h += x.statut === "en_jeu"
    ? '<button class="btn primaire" data-act="statut" data-ep="'+x.id+'" data-val="terminee"'+(res.classee?'':' disabled')+'>Clôturer le jeu</button>'
    : '<button class="btn" data-act="statut" data-ep="'+x.id+'" data-val="en_jeu">Corriger les résultats</button>';
  h += '<button class="btn lien" data-act="manche-vider" data-ep="'+x.id+'" data-k="'+iM+'">Effacer cette manche</button>'+
       '<button class="btn lien" data-act="deverrouiller" data-ep="'+x.id+'">Rouvrir les déclarations</button></div>';
  return h + '</div>';
}

function carteDeclaration(x, j){
  var role = roleDans(x, j.id);
  var pari = x.paris[j.id];
  var ouvertPorteur = panneauOuvert && panneauOuvert.type==="porteur" && panneauOuvert.ep===x.id && panneauOuvert.j===j.id;
  var ouvertPari    = panneauOuvert && panneauOuvert.type==="pari"    && panneauOuvert.ep===x.id && panneauOuvert.j===j.id;

  var etat;
  if (role === "suit") etat = '<span class="pastille suit">suit '+esc(nomDe(x.affiliations[j.id]))+'</span>';
  else if (role === "joue"){
    var n = 0;
    Object.keys(x.affiliations).forEach(function(k){ if (x.affiliations[k] === j.id) n++; });
    var cap = (E.reglages.capaciteActive && Number(E.reglages.capaciteAffilies) > 0) ? Number(E.reglages.capaciteAffilies) : null;
    etat = '<span class="pastille jeu">joue'+(n?' &middot; porte '+n+(cap?'/'+cap:''):'')+'</span>';
  } else etat = '<span class="pastille absent">sans camp</span>';
  if (pari && E.reglages.parisActifs) etat += ' <span class="pastille parie">mise sur '+esc(nomDe(pari))+'</span>';

  var h = '<div class="carte-joueur '+(role==="joue"?"joue":(role==="suit"?"suit":""))+'">'+
    '<div class="rangee" style="gap:10px;margin-bottom:10px;flex-wrap:wrap">'+ jeton(j.id)+
    '<span style="font-weight:700;font-size:.93rem;flex:1;min-width:0">'+esc(j.nom)+'</span>'+etat+'</div>';

  h += '<div class="trio">'+
    '<button class="'+(role==="joue"?"on-joue":"")+'" data-act="declare-joue" data-ep="'+x.id+'" data-j="'+j.id+'">Joue</button>'+
    '<button class="'+(role==="suit"||ouvertPorteur?"on-suit":"")+'" data-act="ouvrir-porteur" data-ep="'+x.id+'" data-j="'+j.id+'">'+
      (role==="suit"?"Suit &#9662;":"Suit")+'</button>'+
    (E.reglages.parisActifs
      ? '<button class="'+(pari||ouvertPari?"on-parie":"")+'" data-act="ouvrir-pari" data-ep="'+x.id+'" data-j="'+j.id+'">'+
        (pari?"Parie &#9662;":"Parie")+'</button>'
      : '<button disabled>Parie</button>')+
    '</div>';

  if (role !== "absent" || pari)
    h += '<div style="margin-top:9px"><button class="btn lien" data-act="declare-vide" data-ep="'+x.id+'" data-j="'+j.id+'">Effacer ses choix</button></div>';

  if (ouvertPorteur){
    var porteurs = porteursPossibles(x, j.id);
    h += '<div class="choix-liste">';
    if (!porteurs.length){
      h += '<span class="petit sourdine">Personne ne joue encore ce jeu. Inscrivez d\'abord un participant.</span>'+
           '<button class="puce-choix puce-annule" data-act="fermer-panneau">Fermer</button>';
    } else {
      h += porteurs.map(function(p){
        var actuel = x.affiliations[j.id] === p.id;
        var bloque = p.blocage && !actuel;
        return '<button class="puce-choix'+(actuel?' actuel':'')+(bloque?' bloque':'')+'" '+
          'data-act="'+(bloque?'porteur-refus':'choisir-porteur')+'" data-ep="'+x.id+'" data-j="'+j.id+'" data-p="'+p.id+'"'+
          (bloque?' title="'+esc(p.blocage.texte)+'"':'')+'>'+ jeton(p.id)+esc(p.nom)+
          (bloque ? '<span class="motif">'+esc(p.blocage.court)+'</span>' : '')+'</button>';
      }).join("") + '<button class="puce-choix puce-annule" data-act="fermer-panneau">Annuler</button>';
    }
    h += '</div>';
    if (motifRefus && motifRefus.ep === x.id && motifRefus.j === j.id)
      h += '<div class="petit" style="color:var(--alerte);margin-top:9px">'+esc(motifRefus.texte)+'</div>';
  }

  if (ouvertPari){
    var mises = misesPossibles(x, j.id);
    h += '<div class="choix-liste paris">';
    if (!mises.length){
      h += '<span class="petit sourdine">Personne ne joue encore ce jeu. Inscrivez d\'abord un participant.</span>'+
           '<button class="puce-choix puce-annule" data-act="fermer-panneau">Fermer</button>';
    } else {
      h += '<span class="petit sourdine" style="width:100%;margin-bottom:2px">Qui va gagner ce jeu ? '+
           'Bon pronostic = +'+fmt(E.reglages.gainPari)+' points.</span>';
      h += mises.map(function(p){
        return '<button class="puce-choix'+(x.paris[j.id]===p.id?' actuel':'')+'" data-act="choisir-pari" '+
          'data-ep="'+x.id+'" data-j="'+j.id+'" data-p="'+p.id+'">'+ jeton(p.id)+esc(p.nom)+'</button>';
      }).join("") +
      (x.paris[j.id] ? '<button class="puce-choix puce-annule" data-act="annuler-pari" data-ep="'+x.id+'" data-j="'+j.id+'">Retirer la mise</button>' : '')+
      '<button class="puce-choix puce-annule" data-act="fermer-panneau">Annuler</button>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

function chronoTexte(x){
  if (!x.debutA) return "";
  var fin = x.finA || Date.now();
  return dureeTexte(fin - x.debutA) + (x.finA ? "" : " en cours");
}

/* ==========================================================================
   11. AFFICHAGE TV
   ========================================================================== */
var DUREE_PANNEAU = 13000;
var iPanneau = 0, tvPause = false, minuterieTV = null;

function panneauxDisponibles(){
  var p = [{ id:"classement", lib: estAveugle() ? "Classement scellé" : "Classement général" }];
  var v = epreuveVedette();
  if (v) p.push({ id:"derniere", lib:v.nom, ep:v });
  if (E.epreuves.length) p.push({ id:"jeux", lib:"Le tableau des jeux" });
  if (Object.keys(pairesAlliance()).length) p.push({ id:"alliances", lib:"Le réseau d'alliances" });
  if (faitsSaillants().length) p.push({ id:"saillants", lib:"Faits saillants" });
  return p;
}

function rendreTV(){
  var dispo = panneauxDisponibles();
  if (iPanneau >= dispo.length) iPanneau = 0;
  var p = dispo[iPanneau] || dispo[0];
  var corps = document.getElementById("tv-corps");

  var finies = E.epreuves.length - epreuvesRestantes();
  var aVenir = null;
  E.epreuves.forEach(function(e){ if (!aVenir && e.statut === "declarations") aVenir = e; });
  if (!aVenir) E.epreuves.forEach(function(e){ if (!aVenir && e.statut === "a_venir") aVenir = e; });

  document.getElementById("tv-titre").textContent = p ? p.lib : (E.nom || "Classement");
  document.getElementById("tv-sous").textContent =
    (E.nom ? E.nom.toUpperCase() + " · " : "") + finies + " / " + E.epreuves.length + " jeux" +
    (aVenir ? " · à suivre : " + aVenir.nom : "");
  document.getElementById("tv-points").innerHTML =
    dispo.map(function(x,i){ return '<span class="'+(i===iPanneau?'on':'')+'"></span>'; }).join("");

  var avant = {};
  Array.prototype.forEach.call(corps.querySelectorAll("[data-jid]"), function(el){
    avant[el.getAttribute("data-jid")] = el.getBoundingClientRect().top;
  });

  if (!p) corps.innerHTML = '<div class="tv-vide">Ajoutez des joueurs pour lancer le classement.</div>';
  else if (p.id === "classement") corps.innerHTML = tvClassement();
  else if (p.id === "derniere")   corps.innerHTML = tvDerniere(p.ep);
  else if (p.id === "jeux")       corps.innerHTML = tvJeux();
  else if (p.id === "alliances")  corps.innerHTML = tvAlliances();
  else                            corps.innerHTML = tvSaillants();

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && corps.querySelector("[data-jid]")){
    Array.prototype.forEach.call(corps.querySelectorAll("[data-jid]"), function(el){
      var a = avant[el.getAttribute("data-jid")];
      if (a === undefined) return;
      var d = a - el.getBoundingClientRect().top;
      if (Math.abs(d) < 2 || !el.animate) return;
      el.animate([{ transform:"translateY("+d+"px)" }, { transform:"translateY(0)" }],
                 { duration:560, easing:"cubic-bezier(.2,.7,.3,1)" });
    });
  }
  relancerProgres();
}

function tvClassement(){
  if (estAveugle()){
    var reste = epreuvesRestantes();
    return '<div class="tv-vide"><div><div class="sceau">&#9878;</div><b>Classement scellé</b>'+
      'Il reste '+reste+' jeu'+(reste>1?'x':'')+'. Les points s\'accumulent en silence.</div></div>';
  }
  var cl = classement();
  if (!cl.length) return '<div class="tv-vide">Ajoutez des joueurs pour lancer le classement.</div>';
  var tete = cl[0].total, mv = mouvements(), hc = horsCourse(cl);
  return '<div class="tv-grille">' + cl.slice(0,12).map(function(r,i){
    var largeur = tete > 0 ? Math.max(0,(r.total/tete)*100) : 0;
    var d = mv ? (mv.rangAvant[r.joueur.id] - (i+1)) : null;
    var ecart = r.departage ? '<span style="color:var(--laiton)">= '+esc(r.departage.court)+'</span>'
             : (i === 0 ? "" : "&#8722;" + fmt(arrondir(tete - r.total)));
    return '<div class="tv-l'+(i===0 && r.total>0?' tete':'')+(hc[r.joueur.id]?' horscourse':'')+'" data-jid="'+r.joueur.id+'">'+
      '<div class="jauge" style="width:'+largeur+'%"></div>'+
      '<span class="place">'+(i+1)+'</span>'+ badgeDelta(d) + jeton(r.joueur.id, true)+
      '<span class="nom">'+esc(r.joueur.nom)+'</span><span class="ecart">'+ecart+'</span>'+
      '<span class="total">'+fmt(r.total)+'</span></div>';
  }).join("") + '</div>';
}

function tvDerniere(x){
  var r = calculerEpreuve(x);
  var liste = Object.keys(r.parJoueur)
    .filter(function(k){ return r.parJoueur[k].pts !== null; })
    .sort(function(a,b){ return r.parJoueur[b].pts - r.parJoueur[a].pts; });
  if (!liste.length) return '<div class="tv-vide">Résultats à venir.</div>';
  return '<div class="tv-liste">' + liste.slice(0,12).map(function(jid, i){
    var v = r.parJoueur[jid];
    var cls = v.role === "suit" ? " suit" : (v.role === "parie" ? " parie" : "");
    var marque = v.role === "suit" ? "&#8627;" : (v.role === "parie" ? "&#9733;" : String(i+1));
    var note = "";
    if (v.role === "suit") note = ' <span class="sourdine" style="font-weight:400">a suivi '+esc(nomDe(v.porteur))+'</span>';
    else if (v.role === "parie") note = ' <span class="sourdine" style="font-weight:400">pronostic gagnant</span>';
    else if (v.gainPari) note = ' <span class="sourdine" style="font-weight:400">+'+fmt(v.gainPari)+' pronostic</span>';
    else if (v.bonus) note = ' <span class="sourdine" style="font-weight:400">+'+fmt(v.bonus)+' porteur</span>';
    return '<div class="tv-r'+cls+'" data-jid="d-'+jid+'"><span class="rg">'+marque+'</span>'+ jeton(jid, true)+
      '<span class="nm">'+esc(nomDe(jid))+note+'</span><span class="pt">'+fmt(v.pts)+'</span></div>';
  }).join("") + '</div>';
}

function tvJeux(){
  if (!E.epreuves.length) return '<div class="tv-vide">Aucun jeu au programme.</div>';
  return '<div class="tv-jeux">' + E.epreuves.map(function(x){
    var p = podium(x, 3);
    var c = '<div class="tv-jeu"><div class="en">'+ blason(x, 22, 'mini')+
      '<span class="nm">'+esc(x.nom)+'</span>'+
      (Number(x.poids)!==1 ? '<span class="creux">&#215;'+esc(x.poids)+'</span>' : '')+'</div>';
    if (p.length){
      c += p.map(function(o,i){
        return '<span class="pl'+(o.v.role==="suit"?" suit":"")+'"><span class="n">'+(i+1)+'</span>'+
          '<span class="q">'+esc(nomDe(o.jid))+(o.v.role==="suit"?' &#8627;':'')+'</span></span>';
      }).join("");
    } else c += '<span class="creux">'+LIB_STATUT[x.statut]+'</span>';
    return c + '</div>';
  }).join("") + '</div>';
}

/* Chaque joueur sur un cercle, une corde par équipe formée.
   L'épaisseur dit combien de fois le duo a joué ensemble. */
function tvAlliances(){
  var js = E.joueurs, n = js.length;
  if (n < 2) return '<div class="tv-vide">Il faut au moins deux joueurs.</div>';
  var paires = pairesAlliance(), cles = Object.keys(paires);
  if (!cles.length) return '<div class="tv-vide">Aucune équipe formée pour l\'instant.</div>';

  var W = 1000, H = 600, cx = 500, cy = 300, R = 200, pos = {};
  js.forEach(function(j,i){
    var a = -Math.PI/2 + i*2*Math.PI/n;
    pos[j.id] = { x: cx + R*Math.cos(a), y: cy + R*Math.sin(a), a:a };
  });
  var maxN = Math.max.apply(null, cles.map(function(k){ return paires[k]; }));
  var s = '<svg class="tv-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Réseau des alliances">';

  cles.forEach(function(k){
    var duo = k.split("|"), a = duo[0], b = duo[1], cnt = paires[k];
    if (!pos[a] || !pos[b]) return;
    s += '<path d="M'+pos[a].x.toFixed(1)+' '+pos[a].y.toFixed(1)+' Q'+cx+' '+cy+' '+
         pos[b].x.toFixed(1)+' '+pos[b].y.toFixed(1)+'" fill="none" stroke="'+jetonCSS("--color-cool","#84B4EA")+'" stroke-width="'+
         (3 + (cnt/maxN)*11).toFixed(1)+'" stroke-linecap="round" opacity="'+(0.3 + 0.5*cnt/maxN).toFixed(2)+'"/>';
  });
  js.forEach(function(j){
    var p = pos[j.id];
    var liens = partenairesDe(j.id).length;
    var lx = cx + (p.x-cx)*1.17, ly = cy + (p.y-cy)*1.17;
    var cosA = Math.cos(p.a);
    var anc = cosA > 0.3 ? "start" : (cosA < -0.3 ? "end" : "middle");
    s += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="21" fill="'+esc(j.couleur)+'"/>'+
      '<text x="'+p.x.toFixed(1)+'" y="'+(p.y+6).toFixed(1)+'" text-anchor="middle" font-family="system-ui,sans-serif" '+
      'font-size="17" font-weight="800" fill="'+jetonCSS("--color-bg","#0F0D12")+'">'+esc(initiales(j.nom))+'</text>'+
      '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anc+'" dominant-baseline="middle" '+
      'font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="'+jetonCSS("--color-fg","#F3EEE9")+'">'+esc(j.nom)+'</text>'+
      '<text x="'+lx.toFixed(1)+'" y="'+(ly+22).toFixed(1)+'" text-anchor="'+anc+'" dominant-baseline="middle" '+
      'font-family="system-ui,sans-serif" font-size="15" fill="'+jetonCSS("--color-muted","#9C90A6")+'">'+liens+' lien'+(liens>1?'s':'')+'</text>';
  });
  return s + '</svg>';
}

/* ==========================================================================
   12. RÉCAPITULATIF PARTAGEABLE
   Dessiné directement au canvas plutôt que via SVG : pas de dépendance à
   la sérialisation, pas de canvas taché, ça marche partout.
   ========================================================================== */
function coinsArrondis(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}
function tronquer(c, texte, largeur){
  if (c.measureText(texte).width <= largeur) return texte;
  var t = texte;
  while (t.length > 1 && c.measureText(t + "…").width > largeur) t = t.slice(0, -1);
  return t + "…";
}

function dessinerRecap(){
  var W = 1080, H = 1500;
  var cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  var c = cv.getContext("2d");
  var S = "system-ui,-apple-system,'Segoe UI',Roboto,sans-serif";
  var M = "ui-monospace,Menlo,Consolas,monospace";

  var T = {
    bg:     jetonCSS("--color-bg","#0F0D12"),
    surf:   jetonCSS("--color-surface","#191620"),
    bord:   jetonCSS("--color-border-soft","#241E2C"),
    fg:     jetonCSS("--color-fg","#F3EEE9"),
    muet:   jetonCSS("--color-muted","#9C90A6"),
    ember:  jetonCSS("--color-ember","#F5903C"),
    emberD: jetonCSS("--color-ember-dim","#7A4A18"),
    cool:   jetonCSS("--color-cool","#84B4EA"),
    moss:   jetonCSS("--color-moss","#86C39B"),
    rose:   jetonCSS("--color-rose","#E58BB4"),
    argent: jetonCSS("--color-silver","#C6CBD4"),
    bronze: jetonCSS("--color-bronze","#C08A55")
  };

  c.fillStyle = T.bg;    c.fillRect(0,0,W,H);
  c.fillStyle = T.surf;  c.fillRect(0,0,W,10);
  c.fillStyle = T.ember; c.fillRect(0,0,W*0.38,10);

  var y = 96;
  c.fillStyle = T.muet; c.font = "700 26px "+S;
  c.fillText(new Date().toLocaleDateString("fr-CA", {year:"numeric", month:"long", day:"numeric"}).toUpperCase(), 72, y);
  y += 62;
  c.fillStyle = T.fg; c.font = "800 60px "+S;
  c.fillText(tronquer(c, E.nom || "Tournoi maison", W-144), 72, y);

  var cl = classement();
  var jouees = E.epreuves.filter(function(x){ return calculerEpreuve(x).classee; });
  y += 34;
  c.fillStyle = T.muet; c.font = "600 27px "+S;
  c.fillText(cl.length + " joueurs · " + jouees.length + " jeux disputés", 72, y);

  // Podium
  y += 56;
  var hauteurs = [190, 150, 128];
  var tons = [T.ember, T.argent, T.bronze];
  for (var i=0; i<Math.min(3, cl.length); i++){
    var hh = hauteurs[i];
    coinsArrondis(c, 72, y, W-144, hh, 22);
    c.fillStyle = T.surf; c.fill();
    c.strokeStyle = i===0 ? T.emberD : T.bord; c.lineWidth = 2; c.stroke();

    c.fillStyle = tons[i]; c.font = "800 " + (i===0?76:56) + "px " + M;
    c.fillText(String(i+1), 108, y + hh/2 + (i===0?26:19));

    c.beginPath();
    c.arc(230, y + hh/2, i===0?42:34, 0, Math.PI*2);
    c.fillStyle = cl[i].joueur.couleur; c.fill();
    c.fillStyle = T.bg; c.font = "800 " + (i===0?32:26) + "px " + S;
    c.textAlign = "center";
    c.fillText(initiales(cl[i].joueur.nom), 230, y + hh/2 + (i===0?11:9));
    c.textAlign = "left";

    c.fillStyle = T.fg; c.font = "750 " + (i===0?52:42) + "px " + S;
    c.fillText(tronquer(c, cl[i].joueur.nom, 480), 292, y + hh/2 + (i===0?18:15));

    c.fillStyle = i===0 ? T.ember : T.fg; c.font = "800 " + (i===0?70:52) + "px " + M;
    c.textAlign = "right";
    c.fillText(fmt(cl[i].total), W-108, y + hh/2 + (i===0?25:19));
    c.textAlign = "left";
    y += hh + 14;
  }

  // Reste du classement
  if (cl.length > 3){
    y += 18;
    c.fillStyle = T.muet; c.font = "700 23px "+S;
    c.fillText("SUITE DU CLASSEMENT", 72, y);
    y += 26;
    for (var k=3; k<Math.min(cl.length, 10); k++){
      y += 46;
      c.fillStyle = T.muet; c.font = "700 30px "+M;
      c.fillText(String(k+1), 76, y);
      c.fillStyle = T.fg; c.font = "650 31px "+S;
      c.fillText(tronquer(c, cl[k].joueur.nom, 560), 140, y);
      c.fillStyle = T.muet; c.font = "700 31px "+M;
      c.textAlign = "right"; c.fillText(fmt(cl[k].total), W-76, y); c.textAlign = "left";
    }
    y += 22;
  }

  // Faits saillants
  var fs = faitsSaillants().slice(0, 3);
  if (fs.length){
    y += 40;
    c.fillStyle = T.muet; c.font = "700 23px "+S;
    c.fillText("FAITS SAILLANTS", 72, y);
    y += 20;
    var largeur = (W - 144 - 24) / Math.max(fs.length,1);
    var couleurs = { "":T.ember, pervenche:T.cool, sauge:T.moss, rose:T.rose };
    fs.forEach(function(f, n){
      var x = 72 + n*(largeur+12);
      coinsArrondis(c, x, y, largeur, 156, 18);
      c.fillStyle = T.surf; c.fill();
      c.strokeStyle = T.bord; c.lineWidth = 2; c.stroke();
      c.fillStyle = T.muet; c.font = "700 17px "+S;
      c.fillText(tronquer(c, f.etiq.toUpperCase(), largeur-36), x+20, y+38);
      c.fillStyle = couleurs[f.ton] || T.ember; c.font = "800 46px "+M;
      c.fillText(tronquer(c, String(f.v), largeur-36), x+20, y+88);
      c.fillStyle = T.fg; c.font = "700 25px "+S;
      c.fillText(tronquer(c, f.q, largeur-36), x+20, y+124);
    });
    y += 178;
  }

  // Vainqueurs par jeu
  if (jouees.length){
    y += 34;
    c.fillStyle = T.muet; c.font = "700 23px "+S;
    c.fillText("VAINQUEURS PAR JEU", 72, y);
    y += 14;
    jouees.slice(0, 8).forEach(function(x){
      y += 44;
      var p = podium(x, 1)[0];
      c.beginPath(); c.arc(90, y-9, 13, 0, Math.PI*2);
      c.fillStyle = x.teinte; c.fill();
      c.fillStyle = T.fg; c.font = "650 28px "+S;
      c.fillText(tronquer(c, x.nom, 460), 118, y);
      c.fillStyle = T.ember; c.font = "700 28px "+S;
      c.textAlign = "right";
      c.fillText(tronquer(c, p ? nomDe(p.jid) : "—", 380), W-76, y);
      c.textAlign = "left";
    });
  }

  c.fillStyle = T.bord; c.font = "600 22px "+S;
  c.textAlign = "center";
  c.fillText("Tourneo", W/2, H-46);
  c.textAlign = "left";

  return cv.toDataURL("image/png");
}

function ouvrirRecap(){
  if (!E.joueurs.length){ alert("Ajoutez des joueurs avant de générer un récapitulatif."); return; }
  if (estAveugle() && !confirm("Le classement est encore scellé. Le récapitulatif affichera tous les totaux.\n\nLe générer quand même ?")) return;
  var url;
  try { url = dessinerRecap(); }
  catch(e){ alert("Le récapitulatif n'a pas pu être dessiné dans ce navigateur."); return; }
  document.getElementById("recap-img").src = url;

}

/* ==========================================================================
   13. ACTIONS
   ========================================================================== */
function reindexerRangs(m){
  var cl = Object.keys(m.rangs).filter(function(j){ return m.rangs[j] > 0; })
                 .sort(function(a,b){ return m.rangs[a] - m.rangs[b]; });
  var neuf = {}, precedent = null, courant = 0;
  cl.forEach(function(j){
    if (m.rangs[j] !== precedent){ courant++; precedent = m.rangs[j]; }
    neuf[j] = courant;
  });
  m.rangs = neuf;
}
function prochainRangLibre(m){
  var pris = Object.keys(m.rangs).map(function(k){ return m.rangs[k]; }).filter(function(r){ return r>0; });
  return pris.length ? Math.max.apply(null, pris) + 1 : 1;
}
function fermerPanneaux(){ panneauOuvert = null; motifRefus = null; }

document.addEventListener("click", function(evt){
  if (MIROIR) return;
  var o = evt.target.closest("[data-onglet]");
  if (o){
    E.onglet = o.getAttribute("data-onglet");
    fermerPanneaux(); epreuveOuverte = null; choixPreset = false;
    rendre(); window.scrollTo(0,0); return;
  }
  var b = evt.target.closest("[data-act]");
  if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  var a = b.getAttribute("data-act");
  if (a === "annuler"){ annuler(); return; }   // jamais empilé sur lui-même
  var avant = instantane();
  try { traiterClic(a, b); } finally { memoriser(avant, a); }
});

function traiterClic(a, b){
  var e = b.getAttribute("data-ep") ? ep(b.getAttribute("data-ep")) : null;
  var j, p, i, k, m, b2, champ, nom, c2, sans, blocage, arch;

  switch(a){
    case "exemple": chargerExemple(); return;
    case "onglet-rang": ongletRang = b.getAttribute("data-v"); break;

    case "joueur-ajoute":
      champ = document.getElementById("nouveau-joueur");
      nom = (champ.value||"").trim();
      if (!nom){ champ.focus(); return; }
      E.joueurs.push({ id:id(), nom:nom, couleur: PALETTE[E.joueurs.length % PALETTE.length] });
      champ.value = "";
      rendre();
      c2 = document.getElementById("nouveau-joueur"); if (c2) c2.focus();
      return;
    case "joueur-retire":
      j = trouverJoueur(b.getAttribute("data-j"));
      if (!j || !confirm("Retirer " + j.nom + " du tournoi ? Ses résultats seront effacés.")) return;
      E.joueurs = E.joueurs.filter(function(x){ return x.id !== j.id; });
      E.epreuves.forEach(function(x){
        x.participants = x.participants.filter(function(q){ return q !== j.id; });
        x.manches.forEach(function(mm){ delete mm.rangs[j.id]; reindexerRangs(mm); });
        delete x.affiliations[j.id];
        delete x.paris[j.id];
        Object.keys(x.affiliations).forEach(function(q){ if (x.affiliations[q] === j.id) delete x.affiliations[q]; });
        Object.keys(x.paris).forEach(function(q){ if (x.paris[q] === j.id) delete x.paris[q]; });
      });
      break;

    case "epreuve-ajoute":
      champ = document.getElementById("nouvelle-epreuve");
      nom = (champ.value||"").trim();
      if (!nom){ champ.focus(); return; }
      p = normaliserEpreuve({ id:id(), nom:nom });
      E.epreuves.push(p);
      champ.value = "";
      choixPreset = false; epreuveOuverte = p.id;
      break;
    case "ouvrir-preset": choixPreset = true; epreuveOuverte = null; break;
    case "fermer-preset": choixPreset = false; break;
    case "ajouter-preset":
      k = Math.max(1, Number(b.getAttribute("data-manches")) || 1);
      m = [];
      for (i=0;i<k;i++) m.push({ id:id(), rangs:{} });
      E.epreuves.push(normaliserEpreuve({
        id:id(), nom:b.getAttribute("data-nom"), icone:b.getAttribute("data-icone"),
        poids:Number(b.getAttribute("data-poids"))||1, teinte:b.getAttribute("data-teinte"), manches:m
      }));
      break;
    case "ouvrir-epreuve": epreuveOuverte = e.id; choixPreset = false; break;
    case "fermer-epreuve": epreuveOuverte = null; break;
    case "aller-jeu":
      E.onglet = "deroulement"; epreuveOuverte = null; choixPreset = false;
      rendre();
      c2 = document.getElementById("jeu-" + e.id);
      if (c2) c2.scrollIntoView({ behavior:"smooth", block:"start" });
      return;
    case "ep-icone": e.icone = b.getAttribute("data-i"); e.image = ""; break;
    case "ep-image-choisir":
      c2 = document.getElementById("img-" + e.id);
      if (c2) c2.click();
      return;
    case "ep-image-vider": e.image = ""; break;
    case "ep-retire":
      if (!e || !confirm("Supprimer « " + e.nom + " » et ses résultats ?")) return;
      E.epreuves = E.epreuves.filter(function(x){ return x.id !== e.id; });
      epreuveOuverte = null;
      break;
    case "ep-monte":
      i = E.epreuves.indexOf(e);
      if (i>0){ E.epreuves.splice(i,1); E.epreuves.splice(i-1,0,e); }
      break;
    case "ep-descend":
      i = E.epreuves.indexOf(e);
      if (i<E.epreuves.length-1){ E.epreuves.splice(i,1); E.epreuves.splice(i+1,0,e); }
      break;
    case "bareme-auto": e.baremeManuel = barmeAutoPour(Math.max(e.participants.length, E.joueurs.length, 2)); break;
    case "bareme-plus":
      b2 = (e.baremeManuel && e.baremeManuel.length) ? e.baremeManuel.slice() : barmeAutoPour(Math.max(E.joueurs.length,2));
      b2.push(0); e.baremeManuel = b2;
      break;
    case "bareme-moins":
      b2 = (e.baremeManuel||[]).slice();
      if (b2.length>1){ b2.pop(); e.baremeManuel = b2; }
      break;

    /* déclarations */
    case "declare-joue":
      j = b.getAttribute("data-j");
      delete e.affiliations[j];
      if (e.participants.indexOf(j) === -1) e.participants.push(j);
      // on ne peut pas parier sur soi-même
      if (e.paris[j] === j) delete e.paris[j];
      Object.keys(e.paris).forEach(function(q){ if (q === j && e.paris[q] === j) delete e.paris[q]; });
      fermerPanneaux();
      break;
    case "declare-vide":
      j = b.getAttribute("data-j");
      e.participants = e.participants.filter(function(q){ return q !== j; });
      e.manches.forEach(function(mm){ delete mm.rangs[j]; reindexerRangs(mm); });
      delete e.affiliations[j];
      delete e.paris[j];
      Object.keys(e.affiliations).forEach(function(q){ if (e.affiliations[q] === j) delete e.affiliations[q]; });
      Object.keys(e.paris).forEach(function(q){ if (e.paris[q] === j) delete e.paris[q]; });
      fermerPanneaux();
      break;
    case "ouvrir-porteur":
      j = b.getAttribute("data-j");
      panneauOuvert = (panneauOuvert && panneauOuvert.type==="porteur" && panneauOuvert.ep===e.id && panneauOuvert.j===j)
        ? null : { type:"porteur", ep:e.id, j:j };
      motifRefus = null;
      break;
    case "ouvrir-pari":
      j = b.getAttribute("data-j");
      panneauOuvert = (panneauOuvert && panneauOuvert.type==="pari" && panneauOuvert.ep===e.id && panneauOuvert.j===j)
        ? null : { type:"pari", ep:e.id, j:j };
      motifRefus = null;
      break;
    case "fermer-panneau": fermerPanneaux(); break;
    case "choisir-porteur":
      j = b.getAttribute("data-j"); p = b.getAttribute("data-p");
      blocage = blocageAffiliation(e, j, p);
      if (blocage){ motifRefus = { ep:e.id, j:j, texte:blocage.texte }; break; }
      e.participants = e.participants.filter(function(q){ return q !== j; });
      e.manches.forEach(function(mm){ delete mm.rangs[j]; reindexerRangs(mm); });
      Object.keys(e.affiliations).forEach(function(q){ if (e.affiliations[q] === j) delete e.affiliations[q]; });
      e.affiliations[j] = p;
      if (e.paris[j] === j) delete e.paris[j];
      fermerPanneaux();
      break;
    case "porteur-refus":
      j = b.getAttribute("data-j"); p = b.getAttribute("data-p");
      blocage = blocageAffiliation(e, j, p);
      motifRefus = { ep:e.id, j:j, texte: blocage ? blocage.texte : "" };
      break;
    case "choisir-pari":
      j = b.getAttribute("data-j"); p = b.getAttribute("data-p");
      if (j === p) break;
      e.paris[j] = p;
      fermerPanneaux();
      break;
    case "annuler-pari":
      delete e.paris[b.getAttribute("data-j")];
      fermerPanneaux();
      break;

    /* déroulement */
    case "statut":
      e.statut = b.getAttribute("data-val");
      if (e.statut === "terminee"){
        E.compteurFin = (E.compteurFin||0) + 1;
        e.rangFin = E.compteurFin;
        if (E.reglages.chronoActif && e.debutA && !e.finA) e.finA = Date.now();
      }
      if (e.statut === "en_jeu" && E.reglages.chronoActif) e.finA = 0;
      fermerPanneaux();
      break;
    case "lancer":
      if (E.reglages.affiliationObligatoire){
        sans = E.joueurs.filter(function(q){ return roleDans(e, q.id) === "absent" && !e.paris[q.id]; })
                        .map(function(q){ return q.nom; });
        if (sans.length && !confirm("Ces joueurs n'ont ni partie, ni porteur, ni pari et marqueront 0 :\n\n" +
            sans.join(", ") + "\n\nLancer quand même ?")) return;
      }
      e.statut = "en_jeu";
      if (E.reglages.chronoActif && !e.debutA) e.debutA = Date.now();
      fermerPanneaux();
      break;
    case "deverrouiller":
      if (!confirm("Rouvrir les déclarations ? Les rangs déjà saisis seront effacés.")) return;
      e.manches = [{ id:id(), rangs:{} }];
      e.statut = "declarations";
      e.debutA = 0; e.finA = 0;
      break;
    case "manche": mancheActive[e.id] = Number(b.getAttribute("data-k")); break;
    case "manche-plus":
      e.manches.push({ id:id(), rangs:{} });
      mancheActive[e.id] = e.manches.length - 1;
      break;
    case "manche-moins":
      if (e.manches.length <= 1) break;
      k = Number(b.getAttribute("data-k"));
      if (!confirm("Retirer la manche " + (k+1) + " et ses résultats ?")) return;
      e.manches.splice(k, 1);
      mancheActive[e.id] = Math.max(0, Math.min(k, e.manches.length - 1));
      break;
    case "manche-vider":
      k = Number(b.getAttribute("data-k"));
      if (e.manches[k]) e.manches[k].rangs = {};
      break;
    case "rang-suivant":
      j = b.getAttribute("data-j");
      m = e.manches[indexManche(e)];
      if (m.rangs[j]){ delete m.rangs[j]; reindexerRangs(m); }
      else m.rangs[j] = prochainRangLibre(m);
      break;

    /* suspense, récap, ligue */
    case "reveler":
      if (!confirm("Révéler le classement général à tout le monde ? Le sceau ne se remet pas tout seul.")) return;
      E.aveugleLeve = true;
      break;
    case "resceller": E.aveugleLeve = false; break;
    case "recap": ouvrirRecap(); return;
    case "archiver":
      if (!confirm("Verser le classement dans la ligue, puis effacer les résultats de la soirée ?\n\n" +
                   "Les joueurs et les jeux sont conservés pour la prochaine fois.")) return;
      if (!archiverSoiree()){ alert("Rien à archiver : ajoutez des joueurs d'abord."); return; }
      E.epreuves.forEach(function(x){
        x.statut = "a_venir"; x.participants = []; x.affiliations = {}; x.paris = {};
        x.manches = [{ id:id(), rangs:{} }]; x.rangFin = 0; x.debutA = 0; x.finA = 0;
      });
      E.compteurFin = 0; E.aveugleLeve = false;
      mancheActive = {};
      ongletRang = "ligue";
      break;
    case "archive-retire":
      if (!confirm("Retirer cette soirée de la ligue ?")) return;
      arch = lireArchives().filter(function(s){ return s.id !== b.getAttribute("data-a"); });
      ecrireArchives(arch);
      break;

    case "exporte": exporter(); return;
    case "importe": document.getElementById("fichier-import").click(); return;
    case "reinit":
      if (!confirm("Effacer entièrement la soirée en cours ? Les archives de ligue sont conservées.")) return;
      Stockage.effacer(CLE);
      E = etatVierge();
      fermerPanneaux(); epreuveOuverte = null; choixPreset = false; mancheActive = {};
      E.onglet = "reglages";
      break;
    default: return;
  }
  rendre();
}

document.addEventListener("change", function(evt){
  var el = evt.target;
  if (el.id === "fichier-import"){ importer(el); return; }
  if (MIROIR) return;
  var a = el.getAttribute ? el.getAttribute("data-act") : null;
  if (!a) return;
  var avant = instantane();
  try { traiterChangement(a, el); } finally { memoriser(avant, a); }
});

function traiterChangement(a, el){
  var e = el.getAttribute("data-ep") ? ep(el.getAttribute("data-ep")) : null;
  var j, r, b2, m;

  switch(a){
    case "ep-image": importerImage(el, e); return;
    case "ep-teinte": e.teinte = el.value; e.image = ""; break;
    case "joueur-nom":
      j = trouverJoueur(el.getAttribute("data-j"));
      if (j) j.nom = el.value.trim() || j.nom;
      break;
    case "joueur-couleur":
      j = trouverJoueur(el.getAttribute("data-j"));
      if (j) j.couleur = el.value;
      break;
    case "ep-nom": e.nom = el.value.trim() || e.nom; break;
    case "ep-poids": e.poids = nombre(el.value); break;
    case "ep-cumul": e.cumul = el.value; break;
    case "ep-mode":
      e.mode = el.value;
      if (e.mode === "manuel" && (!e.baremeManuel || !e.baremeManuel.length))
        e.baremeManuel = barmeAutoPour(Math.max(e.participants.length, E.joueurs.length, 2));
      break;
    case "ep-bareme":
      r = Number(el.getAttribute("data-r"));
      b2 = (e.baremeManuel && e.baremeManuel.length) ? e.baremeManuel.slice() : barmeAutoPour(Math.max(E.joueurs.length,2));
      b2[r-1] = nombre(el.value);
      e.baremeManuel = b2;
      break;
    case "rang-select":
      j = el.getAttribute("data-j");
      m = e.manches[indexManche(e)];
      if (Number(el.value) > 0) m.rangs[j] = Number(el.value); else delete m.rangs[j];
      break;
    case "r-nom": E.nom = el.value.trim() || "Tournoi maison"; break;
    case "r-num": E.reglages[el.getAttribute("data-k")] = nombre(el.value); break;
    case "r-bool": E.reglages[el.getAttribute("data-k")] = el.checked; break;
    default: return;
  }
  rendre();
}

/* --- image personnalisée : recadrée en 128 px pour ne pas saturer le stockage --- */
function importerImage(input, e){
  var f = input.files && input.files[0];
  input.value = "";
  if (!f || !e) return;
  var avant = instantane();
  var url = URL.createObjectURL(f);
  var img = new Image();
  img.onload = function(){
    var T = 128, cv = document.createElement("canvas");
    cv.width = T; cv.height = T;
    var ctx = cv.getContext("2d");
    var cote = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width-cote)/2, (img.height-cote)/2, cote, cote, 0, 0, T, T);
    try { e.image = cv.toDataURL("image/jpeg", 0.82); } catch(err){ e.image = ""; }
    URL.revokeObjectURL(url);
    rendre();
    memoriser(avant, "ep-image");
  };
  img.onerror = function(){ URL.revokeObjectURL(url); alert("Image illisible. Essayez un PNG, un JPEG ou un WebP."); };
  img.src = url;
}

/* --- import / export --- */
function exporter(){
  var blob = new Blob([JSON.stringify(E, null, 2)], { type:"application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = (E.nom || "tourneo").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") +
               "-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}
function importer(input){
  var f = input.files && input.files[0];
  if (!f) return;
  var fr = new FileReader();
  var avant = instantane();
  fr.onload = function(){
    try {
      var o = JSON.parse(fr.result);
      if (!o || !Array.isArray(o.joueurs)) throw new Error("format");
      E = Object.assign(etatVierge(), o);
      E.reglages = Object.assign(reglagesDefaut(), o.reglages || {});
      E.epreuves = (o.epreuves||[]).map(normaliserEpreuve);
      fermerPanneaux(); epreuveOuverte = null; choixPreset = false; mancheActive = {};
      E.onglet = "classement";
      rendre();
      memoriser(avant, "importe");
    } catch(err){
      alert("Ce fichier n'est pas un tournoi exportable. Choisissez un JSON produit par « Exporter ».");
    }
  };
  fr.readAsText(f);
  input.value = "";
}

/* --- soirée d'exemple --- */
function chargerExemple(){
  if (E.joueurs.length && !confirm("Remplacer le contenu actuel par la soirée d'exemple ?")) return;
  E = etatVierge();
  ["Fred","Marie","Tommy","Sophie","Ludo","Ariane"].forEach(function(n,i){
    E.joueurs.push({ id:id(), nom:n, couleur:PALETTE[i % PALETTE.length] });
  });
  ["Mario Kart","Baby-foot","Catan","Dards","Super Smash Bros.","Quiz musical"].forEach(function(nom){
    PRESETS.forEach(function(f){
      f.jeux.forEach(function(g){
        if (g.nom !== nom) return;
        var m = [];
        for (var i=0;i<g.manches;i++) m.push({ id:id(), rangs:{} });
        E.epreuves.push(normaliserEpreuve({ id:id(), nom:g.nom, icone:g.icone, poids:g.poids, teinte:f.teinte, manches:m }));
      });
    });
  });
  fermerPanneaux(); epreuveOuverte = null; choixPreset = false; mancheActive = {};
  E.onglet = "tournoi";
  rendre();
}

      document.getElementById("recap").classList.remove("actif");

  });
  // Chronomètre : on ne redessine pas toute l'interface chaque seconde.
  setInterval(function(){
    if (!E.reglages.chronoActif) return;
    Array.prototype.forEach.call(document.querySelectorAll("[data-chrono]"), function(el){
      var x = ep(el.getAttribute("data-chrono"));
      if (x) el.textContent = chronoTexte(x);
    });
  }, 1000);
} else {
  document.body.classList.add("miroir");

}

    "En attendant, <strong>Réglages &#8594; Exporter</strong> conserve tout dans un fichier.";
}

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
