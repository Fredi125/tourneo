<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tourneo</title>
<meta name="theme-color" content="#0F0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tourneo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<style>
/* ============================================================
   Nuit pétrole, laiton, pervenche.
   Laiton = les points. Pervenche = tout ce qui touche à
   l'affiliation. Sauge = participation. Rose = les paris.
   ============================================================ */
/* ============================================================
   JETONS — convention GameCrawler (Tailwind v4 : --color-*)
   ------------------------------------------------------------
   POUR SYNCHRONISER AVEC GAMECRAWLER : remplacez les valeurs de
   ce seul bloc par celles du @theme de Dan. Tout le reste de la
   feuille en dérive, y compris les fonds teintés (color-mix) et
   les couleurs du récapitulatif (lues au moment du dessin).
   Direction retenue : « a shared bonfire » — braise chaude sur
   nuit profonde, avec le bleu froid de la nuit autour du feu.
   ============================================================ */
:root{
  --color-bg:#0F0D12;
  --color-surface:#191620;
  --color-surface-2:#241F2C;
  --color-border:#332C3C;
  --color-border-soft:#241E2C;
  --color-fg:#F3EEE9;
  --color-muted:#9C90A6;

  --color-ember:#F5903C;        /* l'accent : les points, le meneur */
  --color-ember-dim:#7A4A18;
  --color-cool:#84B4EA;         /* l'affiliation : le côté nuit du feu */
  --color-cool-dim:#2C4763;
  --color-moss:#86C39B;         /* la participation */
  --color-moss-dim:#2C5540;
  --color-rose:#E58BB4;         /* les paris */
  --color-rose-dim:#6B3A55;
  --color-danger:#F0705E;
  --color-danger-dim:#5E2D2A;

  --color-gold:#F5B841;
  --color-silver:#C6CBD4;
  --color-bronze:#C08A55;
}

/* Fonds teintés dérivés — aucun hexadécimal en dur ailleurs. */
:root{
  --tint-ember: color-mix(in srgb, var(--color-ember) 15%, var(--color-bg));
  --tint-cool:  color-mix(in srgb, var(--color-cool) 17%, var(--color-bg));
  --tint-moss:  color-mix(in srgb, var(--color-moss) 14%, var(--color-bg));
  --tint-rose:  color-mix(in srgb, var(--color-rose) 15%, var(--color-bg));
  --tint-danger:color-mix(in srgb, var(--color-danger) 14%, var(--color-bg));
}

/* Noms internes de l'application, branchés sur les jetons. */
:root{
  --nuit:var(--color-bg); --surface:var(--color-surface); --surface2:var(--color-surface-2);
  --ligne:var(--color-border); --ligne-douce:var(--color-border-soft);
  --texte:var(--color-fg); --sourdine:var(--color-muted);
  --laiton:var(--color-ember); --laiton-sombre:var(--color-ember-dim);
  --pervenche:var(--color-cool); --pervenche-sombre:var(--color-cool-dim);
  --sauge:var(--color-moss); --sauge-sombre:var(--color-moss-dim);
  --rose:var(--color-rose); --rose-sombre:var(--color-rose-dim);
  --alerte:var(--color-danger);
  --argent:var(--color-silver); --bronze:var(--color-bronze);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  --r:14px; --tap:46px;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--nuit);color:var(--texte);font-family:var(--sans);font-size:16px;
  line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
body.miroir{padding-bottom:0;overflow:hidden}
/* « A shared bonfire » — la lueur des braises, une seule fois, en haut. */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:440px;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 130% 100% at 50% -14%,
    color-mix(in srgb,var(--color-ember) 14%,transparent), transparent 68%)}
header.appbar,main,nav.onglets{position:relative;z-index:1}
body.miroir header.appbar,body.miroir main,body.miroir nav.onglets{display:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--laiton);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.etiq{font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;color:var(--sourdine);font-weight:700}
.chiffre{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sourdine{color:var(--sourdine)}
.petit{font-size:.82rem}

header.appbar{position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--nuit) 72%,transparent);
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.appbar .marque{display:flex;flex-direction:column;gap:1px}
header.appbar .sigle{font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--color-ember);font-weight:800;line-height:1}
header.appbar h1{margin:0;font-size:1.06rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
header.appbar .cadence{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--laiton);font-weight:700}
#btn-annuler{border-color:var(--laiton-sombre);color:var(--laiton)}
#btn-annuler:hover{background:var(--tint-ember)}
@media (max-width:620px){ #btn-fenetre{display:none} }
main{padding:0 16px 28px;max-width:1000px;margin:0 auto}
section.vue{display:none}
section.vue.actif{display:block}

nav.onglets{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--ligne);padding-bottom:env(safe-area-inset-bottom)}
nav.onglets button{padding:11px 2px 13px;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--sourdine);
  border-top:2px solid transparent;margin-top:-1px;min-height:var(--tap)}
nav.onglets button .g{font-size:1.15rem;line-height:1}
nav.onglets button[aria-current="true"]{color:var(--laiton);border-top-color:var(--laiton)}

.carte{background:var(--surface);border:1px solid var(--ligne-douce);border-radius:var(--r);padding:15px;margin-bottom:12px}
.carte.mince{padding:12px 13px}
h2.titre{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sourdine);font-weight:700;margin:22px 0 10px}
h2.titre:first-child{margin-top:12px}
.entete{margin:28px 0 15px}
.entete:first-child{margin-top:14px}
.entete .oeil{display:block;font-size:.67rem;letter-spacing:.19em;text-transform:uppercase;
  color:var(--color-ember);font-weight:700;margin-bottom:7px}
.entete h2{margin:0;font-size:1.7rem;font-weight:800;letter-spacing:-.033em;line-height:1.06}
.entete h2 em{font-style:italic;color:var(--color-ember)}
.entete .sous{margin:8px 0 0;color:var(--sourdine);font-size:.87rem;line-height:1.5;max-width:52ch}
@media (max-width:420px){.entete h2{font-size:1.46rem}}
.rangee{display:flex;align-items:center;gap:10px}
.rangee.entre{justify-content:space-between}
.pousse{margin-left:auto}
.pile{display:flex;flex-direction:column;gap:9px}
hr.sep{border:none;border-top:1px solid var(--ligne-douce);margin:16px 0}

.btn{background:var(--surface2);border:1px solid var(--ligne);color:var(--texte);border-radius:9px;
  padding:11px 16px;font-size:.88rem;font-weight:600;min-height:var(--tap);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:background .12s ease,transform .1s ease}
.btn:hover{background:var(--ligne)}
.btn:active{transform:scale(.97)}
.btn.primaire{background:var(--laiton);color:var(--color-bg);border-color:var(--laiton);font-weight:750}
.btn.primaire:hover{background:color-mix(in srgb,var(--color-ember) 82%,#fff)}
.btn.lien{background:none;border:none;color:var(--sourdine);text-decoration:underline;padding:8px 4px;
  font-size:.83rem;min-height:38px}
.btn.lien:hover{color:var(--texte)}
.btn.danger{color:var(--alerte);border-color:var(--color-danger-dim)}
.btn.danger:hover{background:var(--tint-danger)}
.btn.mini{padding:7px 12px;font-size:.79rem;border-radius:8px;min-height:38px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn[disabled]:active{transform:none}
input[type=text],input[type=number],select,textarea{background:var(--nuit);border:1px solid var(--ligne);
  border-radius:9px;padding:11px 12px;width:100%;font-size:.92rem;min-height:var(--tap)}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[type=color]{background:none;border:1px solid var(--ligne);border-radius:9px;width:46px;height:44px;padding:3px;flex:0 0 auto}
label.champ{display:block;margin-bottom:14px}
label.champ .nom{display:block;margin-bottom:6px;font-size:.82rem;font-weight:650}
label.champ .aide{display:block;margin-top:6px;font-size:.77rem;color:var(--sourdine);line-height:1.45}
.bascule{display:flex;align-items:flex-start;gap:11px;margin-bottom:14px;cursor:pointer;
  padding:4px 0;min-height:40px}
.bascule input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--laiton);margin-top:2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:540px){.duo{grid-template-columns:1fr}}

.segments{display:flex;background:var(--surface);border:1px solid var(--ligne-douce);border-radius:11px;
  padding:4px;gap:4px;margin:12px 0}
.segments button{flex:1;padding:10px 8px;border-radius:8px;font-size:.83rem;font-weight:700;
  color:var(--sourdine);min-height:42px}
.segments button[aria-pressed="true"]{background:var(--surface2);color:var(--texte)}

.pastille{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;
  font-size:.71rem;font-weight:700;letter-spacing:.04em;border:1px solid transparent;white-space:nowrap}
.pastille.jeu{background:var(--tint-moss);color:var(--sauge);border-color:var(--sauge-sombre)}
.pastille.suit{background:var(--tint-cool);color:var(--pervenche);border-color:var(--pervenche-sombre)}
.pastille.parie{background:var(--tint-rose);color:var(--rose);border-color:var(--rose-sombre)}
.pastille.absent{background:var(--tint-danger);color:var(--alerte);border-color:var(--color-danger-dim)}
.pastille.etat{background:var(--surface2);color:var(--sourdine);border-color:var(--ligne)}
.pastille.etat.declarations{color:var(--laiton);border-color:var(--laiton-sombre);background:var(--tint-ember)}
.pastille.etat.en_jeu{color:var(--pervenche);border-color:var(--pervenche-sombre);background:var(--tint-cool)}
.pastille.etat.terminee{color:var(--sauge);border-color:var(--sauge-sombre);background:var(--tint-moss)}
.pastille.horscourse{background:var(--tint-danger);color:var(--alerte);border-color:var(--color-danger-dim)}

.jeton{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:.71rem;font-weight:800;color:var(--color-bg);letter-spacing:-.02em}
.jeton.gros{width:36px;height:36px;font-size:.86rem}

/* cercle d'équipe */
.cercle{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.lien{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--pervenche-sombre);background:var(--tint-cool);
  color:var(--pervenche);border-radius:999px;padding:2px 9px 2px 3px;font-size:.71rem;font-weight:700;
  animation:apparait .28s ease}
.lien .jeton{width:18px;height:18px;font-size:.57rem}
.encoche{width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--ligne);flex:0 0 auto}
@keyframes apparait{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

.delta{font-family:var(--mono);font-size:.73rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.delta.monte{color:var(--sauge)} .delta.descend{color:var(--alerte)} .delta.stable{color:var(--ligne)}

.ligne-classement{display:flex;align-items:center;gap:11px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--ligne-douce);border-radius:var(--r);margin-bottom:7px;position:relative;overflow:hidden}
.ligne-classement .jauge{position:absolute;left:0;top:0;bottom:0;background:var(--laiton);opacity:.09;
  transition:width .45s cubic-bezier(.2,.7,.3,1)}
.ligne-classement > *{position:relative}
.ligne-classement .place{font-family:var(--mono);font-size:.95rem;font-weight:700;color:var(--sourdine);
  width:24px;text-align:right;flex:0 0 auto}
.ligne-classement.tete{border-color:var(--laiton-sombre);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--color-ember) 18%,transparent), 0 8px 28px color-mix(in srgb,var(--color-ember) 9%,transparent)}
.ligne-classement.tete .place{color:var(--laiton)}
.ligne-classement .bloc-nom{flex:1;min-width:0}
.ligne-classement .nom{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ligne-classement .sous{font-size:.71rem;color:var(--sourdine);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.ligne-classement .total{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.36rem;
  font-weight:700;letter-spacing:-.03em}
.ligne-classement.tete .total{color:var(--laiton)}
.ligne-classement.horscourse{opacity:.6}

.defile{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--ligne-douce);border-radius:var(--r)}
table.matrice{border-collapse:collapse;width:100%;font-size:.83rem;background:var(--surface)}
table.matrice th,table.matrice td{padding:9px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--ligne-douce)}
table.matrice th:first-child,table.matrice td:first-child{text-align:left;position:sticky;left:0;
  background:var(--surface);z-index:2;border-right:1px solid var(--ligne-douce)}
table.matrice thead th{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sourdine);font-weight:700}
table.matrice tbody tr:last-child td{border-bottom:none}
table.matrice td.val{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.matrice td.herite{color:var(--pervenche)}
table.matrice td.vide{color:var(--ligne)}
table.matrice td.tot{color:var(--laiton);font-weight:700}

/* déclarations et saisie */
.carte-joueur{background:var(--nuit);border:1px solid var(--ligne-douce);border-radius:var(--r);padding:12px 13px}
.carte-joueur.joue{border-color:var(--sauge-sombre)}
.carte-joueur.suit{border-color:var(--pervenche-sombre)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.trio button{min-height:44px;border-radius:9px;border:1px solid var(--ligne-douce);background:var(--surface);
  font-size:.83rem;font-weight:700;color:var(--sourdine);display:flex;align-items:center;justify-content:center;gap:5px;
  transition:background .12s,color .12s,border-color .12s}
.trio button:active{transform:scale(.97)}
.trio button.on-joue{background:var(--tint-moss);border-color:var(--sauge);color:var(--sauge)}
.trio button.on-suit{background:var(--tint-cool);border-color:var(--pervenche);color:var(--pervenche)}
.trio button.on-parie{background:var(--tint-rose);border-color:var(--rose);color:var(--rose)}
.trio button[disabled]{opacity:.35}

.choix-liste{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:11px;
  border-top:1px dashed var(--ligne-douce);animation:deplie .18s ease}
@keyframes deplie{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.puce-choix{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--pervenche-sombre);
  background:var(--tint-cool);color:var(--pervenche);border-radius:999px;padding:6px 15px 6px 6px;
  font-size:.85rem;font-weight:700;min-height:42px;transition:background .12s ease,transform .1s ease}
.puce-choix:hover{background:color-mix(in srgb,var(--color-cool) 26%,var(--color-bg))}
.puce-choix:active{transform:scale(.95)}
.puce-choix .jeton{width:26px;height:26px;font-size:.66rem}
.puce-choix.actuel{background:var(--pervenche);color:var(--color-bg);border-color:var(--pervenche)}
.puce-choix.bloque{border-color:var(--ligne);background:var(--surface2);color:var(--sourdine);opacity:.62}
.puce-choix.bloque:hover{background:var(--ligne);opacity:.88}
.puce-choix .motif{font-size:.69rem;font-weight:600;opacity:.9}
.choix-liste.paris .puce-choix{border-color:var(--rose-sombre);background:var(--tint-rose);color:var(--rose)}
.choix-liste.paris .puce-choix:hover{background:color-mix(in srgb,var(--color-rose) 24%,var(--color-bg))}
.choix-liste.paris .puce-choix.actuel{background:var(--rose);color:var(--color-bg);border-color:var(--rose)}
.puce-annule{border-color:var(--ligne)!important;background:none!important;color:var(--sourdine)!important;
  padding:6px 15px;font-weight:600}

.tuile-rang{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--nuit);
  border:1px solid var(--ligne-douce);border-radius:10px;width:100%;text-align:left;min-height:56px;
  transition:border-color .12s,background .12s,transform .1s}
.tuile-rang:active{transform:scale(.985)}
.tuile-rang.classe{border-color:var(--laiton-sombre);background:var(--tint-ember)}
.tuile-rang .nom{flex:1;min-width:0;font-weight:650;font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge-rang{font-family:var(--mono);font-weight:800;font-size:1.15rem;min-width:34px;text-align:center;color:var(--laiton)}
.badge-rang.creux{color:var(--ligne)}
.tuile-suiveur{display:flex;align-items:center;gap:11px;padding:10px 13px;background:var(--tint-cool);
  border:1px solid var(--pervenche-sombre);border-radius:10px;min-height:48px}
.tuile-suiveur.paris{background:var(--tint-rose);border-color:var(--rose-sombre)}

.manches{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.manche{min-height:40px;padding:8px 15px;border-radius:9px;border:1px solid var(--ligne-douce);
  background:var(--surface);font-size:.83rem;font-weight:700;color:var(--sourdine);
  display:inline-flex;align-items:center;gap:6px}
.manche[aria-pressed="true"]{border-color:var(--laiton);color:var(--laiton);background:var(--tint-ember)}
.manche .ok{color:var(--sauge);font-size:.9rem}
.manche.ajout{border-style:dashed}

.avis{border-left:3px solid var(--laiton);background:var(--tint-ember);padding:10px 13px;border-radius:0 9px 9px 0;
  font-size:.84rem;line-height:1.5;margin-bottom:12px}
.avis.info{border-color:var(--pervenche);background:var(--tint-cool)}
.avis.rose{border-color:var(--rose);background:var(--tint-rose)}
.avis.grave{border-color:var(--alerte);background:var(--tint-danger)}

/* galerie de jeux */
.grille-jeux{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-bottom:12px}
.tuile-jeu{background:var(--surface);border:1px solid var(--ligne-douce);border-radius:16px;padding:14px 13px 12px;
  text-align:left;width:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;
  min-height:150px;transition:border-color .14s ease,transform .1s ease}
.tuile-jeu:hover{border-color:var(--ligne)}
.tuile-jeu:active{transform:scale(.985)}
.tuile-jeu .halo{position:absolute;top:-36px;right:-36px;width:100px;height:100px;border-radius:50%;opacity:.13}
/* L'illustration baigne la tuile, le texte reste lisible par-dessus. */
.tuile-jeu .fond-jeu{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:.34;mask-image:linear-gradient(to bottom,#000 0%,#000 34%,transparent 76%);
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 34%,transparent 76%)}
.puce-icone img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
.puce-icone{overflow:hidden;padding:0}
.tuile-jeu > *{position:relative}
.blason{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.blason img{width:100%;height:100%;object-fit:cover;display:block}
.blason.mini{width:36px;height:36px;border-radius:10px}
.tuile-jeu .nom-jeu{font-weight:700;font-size:.94rem;line-height:1.2;letter-spacing:-.01em}
.tuile-jeu .etat-jeu{font-size:.65rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--sourdine);margin-top:2px}
.podium-mini{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--ligne-douce);padding-top:9px;margin-top:auto}
.podium-mini .pl{display:flex;align-items:center;gap:7px;font-size:.79rem;line-height:1.3}
.podium-mini .pl .n{font-family:var(--mono);font-weight:800;color:var(--laiton);width:11px;flex:0 0 auto}
.podium-mini .pl:nth-child(2) .n{color:var(--argent)}
.podium-mini .pl:nth-child(3) .n{color:var(--bronze)}
.podium-mini .pl .q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.podium-mini .pl .p{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--sourdine);font-size:.75rem}
.podium-mini .pl.suit .q{color:var(--pervenche)}
.podium-mini .creux{font-size:.77rem;color:var(--sourdine);line-height:1.4}
.reglage-jeu{position:absolute;top:9px;right:9px;width:38px;height:38px;border-radius:10px;display:grid;
  place-items:center;color:var(--sourdine);background:color-mix(in srgb,var(--color-bg) 72%,transparent);z-index:3;font-size:1rem}
.reglage-jeu:hover{color:var(--texte);background:var(--surface2)}
.tuile-ajout{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--sourdine);gap:7px}
.tuile-ajout:hover{color:var(--texte);border-color:var(--laiton-sombre)}
.tuile-ajout .plus{font-size:1.9rem;line-height:1;font-weight:300}

.famille{margin-bottom:16px}
.famille .etiq{display:block;margin-bottom:8px}
.grille-presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:8px}
.preset{display:flex;align-items:center;gap:10px;background:var(--nuit);border:1px solid var(--ligne-douce);
  border-radius:11px;padding:10px 12px;text-align:left;min-height:58px;transition:border-color .12s,background .12s,transform .1s}
.preset:hover{border-color:var(--ligne);background:var(--surface2)}
.preset:active{transform:scale(.98)}
.preset .t{flex:1;min-width:0}
.preset .t b{display:block;font-size:.85rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset .t span{display:block;font-size:.69rem;color:var(--sourdine)}
.preset[disabled]{opacity:.38}

.grille-icones{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
.puce-icone{aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--ligne-douce);border-radius:11px;
  color:var(--sourdine);background:var(--nuit);min-height:48px}
.puce-icone:hover{color:var(--texte);border-color:var(--ligne)}
.puce-icone.actif{border-color:var(--laiton);color:var(--laiton);background:var(--tint-ember)}

.faits{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
.fait{background:var(--surface);border:1px solid var(--ligne-douce);border-radius:var(--r);padding:13px 14px}
.fait .etiq{display:block;margin-bottom:6px}
.fait .v{font-family:var(--mono);font-weight:800;font-size:1.4rem;color:var(--laiton);letter-spacing:-.03em}
.fait .q{font-weight:650;font-size:.91rem;margin-top:2px}
.fait .d{color:var(--sourdine);font-size:.77rem;margin-top:2px;line-height:1.4}
.fait.pervenche .v{color:var(--pervenche)}
.fait.sauge .v{color:var(--sauge)}
.fait.rose .v{color:var(--rose)}

.scelle{background:linear-gradient(160deg,var(--tint-ember),var(--color-surface));border:1px solid var(--laiton-sombre);
  border-radius:16px;padding:30px 22px;text-align:center}
.scelle .sceau{font-size:2.6rem;line-height:1;color:var(--laiton);margin-bottom:12px}
.scelle strong{display:block;font-size:1.12rem;font-weight:800;margin-bottom:7px}
.scelle p{margin:0 auto 18px;max-width:420px;color:var(--sourdine);font-size:.88rem;line-height:1.55}

.vide-etat{text-align:center;padding:34px 18px;color:var(--sourdine);font-size:.9rem;line-height:1.6}
.vide-etat strong{display:block;color:var(--texte);font-size:1.04rem;margin-bottom:7px;font-weight:700}
.bandeau{background:var(--tint-danger);border:1px solid var(--color-danger-dim);color:var(--color-danger);padding:10px 14px;font-size:.81rem;
  line-height:1.45;margin:0 16px 12px;border-radius:9px}
.bandeau code{font-family:var(--mono);font-size:.94em}
.grille-bareme{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.grille-bareme label{font-size:.69rem;color:var(--sourdine);font-weight:700}
.grille-bareme input{padding:8px;font-size:.86rem;margin-top:4px;min-height:42px}

/* ============================ TV ============================ */
#tv{position:fixed;inset:0;z-index:100;background:var(--nuit);display:none;flex-direction:column;overflow:hidden}
#tv.actif{display:flex}
.tv-tete{display:flex;align-items:flex-start;gap:16px;padding:2.6vh 3.4vw 1.4vh;flex-wrap:wrap}
.tv-tete h2{margin:0;font-size:clamp(1.2rem,3vw,2.3rem);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tv-tete .etiq{font-size:clamp(.6rem,.95vw,.82rem)}
.tv-cmd{margin-left:auto;display:flex;gap:6px;align-items:center;opacity:.3;transition:opacity .2s}
#tv:hover .tv-cmd,.tv-cmd:focus-within{opacity:1}
.tv-cmd .btn{padding:8px 13px;font-size:.82rem;min-height:40px}
.tv-barre{height:3px;background:var(--ligne-douce);margin:0 3.4vw;border-radius:2px;overflow:hidden;flex:0 0 auto}
#tv-progres{height:100%;width:0;background:var(--laiton);opacity:.75}
#tv-progres.court{animation-name:remplit;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes remplit{from{width:0}to{width:100%}}
#tv-corps{flex:1;min-height:0;padding:1.8vh 3.4vw 1vh;display:flex;flex-direction:column;overflow:hidden}
.tv-points{display:flex;gap:7px;justify-content:center;padding:0 0 2.2vh;flex:0 0 auto}
.tv-points span{width:28px;height:4px;border-radius:2px;background:var(--ligne-douce)}
.tv-points span.on{background:var(--laiton)}

.tv-grille{display:flex;flex-direction:column;gap:.85vh;flex:1;min-height:0}
.tv-l{display:flex;align-items:center;gap:clamp(9px,1.5vw,24px);padding:0 clamp(12px,1.6vw,22px);border-radius:12px;
  background:var(--surface);flex:1;min-height:0;border:1px solid var(--ligne-douce);position:relative;overflow:hidden}
.tv-l .jauge{position:absolute;left:0;top:0;bottom:0;background:var(--laiton);opacity:.1;transition:width .6s cubic-bezier(.2,.7,.3,1)}
.tv-l > *{position:relative}
.tv-l .place{font-family:var(--mono);font-weight:700;color:var(--sourdine);font-size:clamp(1rem,2.2vw,1.9rem);
  width:clamp(28px,3.4vw,56px);text-align:right}
.tv-l .nom{font-weight:700;font-size:clamp(1rem,2.7vw,2.3rem);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-l .total{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(1.2rem,3.6vw,3rem);letter-spacing:-.03em}
.tv-l .delta{font-size:clamp(.7rem,1.3vw,1.1rem)}
.tv-l .ecart{font-family:var(--mono);color:var(--sourdine);font-size:clamp(.66rem,1.1vw,.95rem);min-width:clamp(44px,7vw,150px);text-align:right}
.tv-l.tete{border-color:var(--laiton-sombre)}
.tv-l.tete .place,.tv-l.tete .total{color:var(--laiton)}
.tv-l.horscourse{opacity:.5}

.tv-podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1.4vh 1.2vw;flex:0 0 auto}
.tv-carte{background:var(--surface);border:1px solid var(--ligne-douce);border-radius:14px;
  padding:clamp(12px,1.6vh,22px) clamp(14px,1.4vw,22px)}
.tv-carte .etiq{display:block;margin-bottom:6px}
.tv-carte .gros{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:800;
  font-size:clamp(1.5rem,3.4vw,2.8rem);letter-spacing:-.03em;line-height:1.05;color:var(--laiton)}
.tv-carte .qui{font-weight:700;font-size:clamp(.95rem,1.7vw,1.4rem);margin-top:4px}
.tv-carte .quoi{color:var(--sourdine);font-size:clamp(.72rem,1.1vw,.95rem);margin-top:2px;line-height:1.35}
.tv-carte.pervenche .gros{color:var(--pervenche)}
.tv-carte.sauge .gros{color:var(--sauge)}
.tv-carte.rose .gros{color:var(--rose)}

.tv-liste{display:flex;flex-direction:column;gap:.7vh;flex:1;min-height:0;overflow:hidden}
.tv-r{display:flex;align-items:center;gap:clamp(9px,1.4vw,20px);padding:clamp(6px,1vh,14px) clamp(12px,1.5vw,20px);
  background:var(--surface);border:1px solid var(--ligne-douce);border-radius:11px}
.tv-r.suit{border-color:var(--pervenche-sombre);background:var(--tint-cool)}
.tv-r.parie{border-color:var(--rose-sombre);background:var(--tint-rose)}
.tv-r .rg{font-family:var(--mono);font-weight:800;font-size:clamp(1rem,2vw,1.7rem);width:clamp(30px,3vw,50px);
  text-align:right;color:var(--laiton)}
.tv-r.suit .rg{color:var(--pervenche);font-size:clamp(.9rem,1.6vw,1.3rem)}
.tv-r.parie .rg{color:var(--rose);font-size:clamp(.9rem,1.6vw,1.3rem)}
.tv-r .nm{flex:1;min-width:0;font-weight:700;font-size:clamp(.95rem,2vw,1.6rem);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-r .pt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(1.05rem,2.4vw,2rem)}
.tv-r.suit .pt{color:var(--pervenche)}
.tv-r.parie .pt{color:var(--rose)}
.tv-svg{flex:1;min-height:0;width:100%}
.tv-vide{flex:1;display:grid;place-items:center;color:var(--sourdine);font-size:clamp(.9rem,1.6vw,1.3rem);text-align:center;padding:0 6vw}
.tv-vide .sceau{font-size:clamp(2.4rem,7vw,5rem);color:var(--laiton);margin-bottom:2vh}
.tv-vide b{display:block;color:var(--texte);font-size:clamp(1.2rem,3vw,2.4rem);margin-bottom:1.2vh}

.tv-jeux{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.2vh 1vw;flex:1;min-height:0;
  align-content:start;overflow:hidden}
.tv-jeu{background:var(--surface);border:1px solid var(--ligne-douce);border-radius:14px;
  padding:clamp(9px,1.3vh,18px) clamp(11px,1.1vw,18px);display:flex;flex-direction:column;gap:.7vh;overflow:hidden}
.tv-jeu .en{display:flex;align-items:center;gap:clamp(8px,.8vw,14px)}
.tv-jeu .nm{font-weight:700;font-size:clamp(.8rem,1.35vw,1.15rem);line-height:1.15;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-jeu .pl{display:flex;align-items:center;gap:7px;font-size:clamp(.72rem,1.15vw,1rem);line-height:1.35}
.tv-jeu .pl .n{font-family:var(--mono);font-weight:800;color:var(--laiton);width:11px;flex:0 0 auto}
.tv-jeu .pl:nth-of-type(2) .n{color:var(--argent)}
.tv-jeu .pl:nth-of-type(3) .n{color:var(--bronze)}
.tv-jeu .pl .q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tv-jeu .pl.suit .q{color:var(--pervenche)}
.tv-jeu .creux{color:var(--sourdine);font-size:clamp(.7rem,1.05vw,.9rem)}

/* récapitulatif */
#recap{position:fixed;inset:0;z-index:120;background:color-mix(in srgb,var(--color-bg) 94%,transparent);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
#recap.actif{display:flex}
#recap img{max-width:min(460px,92vw);max-height:66vh;border-radius:14px;border:1px solid var(--ligne);
  box-shadow:0 18px 50px rgba(0,0,0,.5)}
#recap .actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}

/* ==========================================================================
   1. STOCKAGE
   localStorage quand il est disponible, mémoire vive sinon, et le mode
   dégradé est annoncé à l'écran : perdre une soirée sans avertissement
   serait pire que de ne rien sauvegarder du tout.
   ========================================================================== */
var MIROIR = location.hash === "#tv";

var Stockage = (function(){
  var dispo = false;
  try {
    var t = "__essai_tourneo__";
    window.localStorage.setItem(t, "1");
    window.localStorage.removeItem(t);
    dispo = true;
  } catch (e) { dispo = false; }
  var memoire = {};
  // L'application s'est appelée « Tournoi maison » avant Tourneo : on
  // récupère les soirées enregistrées sous l'ancien nom, une fois, sans
  // effacer l'original au cas où il faudrait revenir en arrière.
  var HERITAGE = { "tourneo-v1":"tournoi-maison-v1", "tourneo-archives":"tournoi-maison-archives" };
  return {
    dispo: dispo,
    lire: function(cle){
      try {
        var v = dispo ? window.localStorage.getItem(cle) : (memoire[cle] === undefined ? null : memoire[cle]);
        if (v === null && dispo && HERITAGE[cle]){
          v = window.localStorage.getItem(HERITAGE[cle]);
          if (v !== null) this.ecrire(cle, v);
        }
        return v;
      }
      catch(e){ return memoire[cle] === undefined ? null : memoire[cle]; }
    },
    ecrire: function(cle, val){
      memoire[cle] = val;
      if (!dispo) return false;
      try { window.localStorage.setItem(cle, val); return true; } catch(e){ return false; }
    },
    effacer: function(cle){
      delete memoire[cle];
      if (dispo) { try { window.localStorage.removeItem(cle); } catch(e){} }
    }
  };
})();
var CLE = "tourneo-v1";
var CLE_ARCHIVES = "tourneo-archives";

    affiliationObligatoire: true,
    parisActifs: true, gainPari: 3,
    aveugleActif: false, aveugleDernieres: 2,

  };
}

function etatVierge(){

           joueurs:[], epreuves:[], compteurFin:0, aveugleLeve:false, onglet:"tournoi" };
}

var E = etatVierge();

function instantane(){
  try { return JSON.stringify({ e:E, a:lireArchives() }); } catch(err){ return null; }
}
function memoriser(avant, action){
  if (avant === null || MIROIR) return;
  if (instantane() === avant) return;
  historique.push({ etat:avant, libelle: LIB_ACTION[action] || "la dernière modification" });
  if (historique.length > 12) historique.shift();
  majAnnuler();
}
function majAnnuler(){
  var b = document.getElementById("btn-annuler");
  if (!b) return;
  var h = historique[historique.length-1];
  b.hidden = !h;
  if (h) b.title = "Annuler " + h.libelle;
}
function annuler(){
  var h = historique.pop();
  if (!h) return;
  var o;
  try { o = JSON.parse(h.etat); } catch(err){ majAnnuler(); return; }
  E = Object.assign(etatVierge(), o.e);
  E.reglages = Object.assign(reglagesDefaut(), (o.e && o.e.reglages) || {});
  E.epreuves = ((o.e && o.e.epreuves) || []).map(normaliserEpreuve);
  ecrireArchives(o.a || []);
  fermerPanneaux(); epreuveOuverte = null; choixPreset = false; mancheActive = {};
  rendre();
  majAnnuler();
}

function charger(){
  var brut = Stockage.lire(CLE);
  if (!brut) return false;
  try {
    var o = JSON.parse(brut);
    if (!o || typeof o !== "object") return false;
    E = Object.assign(etatVierge(), o);
    E.reglages = Object.assign(reglagesDefaut(), o.reglages || {});
    E.joueurs = Array.isArray(o.joueurs) ? o.joueurs : [];
    E.epreuves = (Array.isArray(o.epreuves) ? o.epreuves : []).map(normaliserEpreuve);
    E.compteurFin = Number(o.compteurFin) || 0;
    return true;
  } catch(e){ return false; }
}

var minuterieSauvegarde = null;
function sauvegarder(){
  if (MIROIR) return;
  clearTimeout(minuterieSauvegarde);
  minuterieSauvegarde = setTimeout(function(){
    Stockage.ecrire(CLE, JSON.stringify(E));
  }, 160);
}

function normaliserEpreuve(ep){
  var x = Object.assign({
    id:id(), nom:"Épreuve", poids:1, mode:"auto", baremeManuel:[],
    icone:"manette", teinte:"#84B4EA", image:"",
    statut:"a_venir", participants:[], affiliations:{}, paris:{},
    manches:[], cumul:"somme", debutA:0, finA:0, rangFin:0
  }, ep || {});
  // Reprise des fichiers d'avant les manches multiples.
  if ((!x.manches || !x.manches.length)){
    x.manches = [{ id:id(), rangs: (ep && ep.rangs) ? ep.rangs : {} }];
  }
  x.manches = x.manches.map(function(m){ return { id:m.id||id(), rangs:m.rangs||{} }; });
  delete x.rangs;
  return x;
}

/* ==========================================================================
   3. MOTEUR DE POINTAGE
   ========================================================================== */
function pointsRang(ep, rang, N){
  if (!rang || rang < 1) return 0;
  if (ep.mode === "manuel"){
    var b = ep.baremeManuel || [];
    if (!b.length) return 0;
    return Number(rang <= b.length ? b[rang-1] : b[b.length-1]) || 0;
  }
  var base = Number(E.reglages.ptsBase) || 0;
  var etendue = Number(E.reglages.ptsEtendue) || 0;
  var v = (N <= 1) ? base + etendue
                   : base + etendue * (N - Math.min(rang, N)) / (N - 1);
  return E.reglages.pointsEntiers ? Math.round(v) : v;
}

function barmeAutoPour(N){
  var out = [], n = Math.max(N, 1);
  for (var r = 1; r <= n; r++) out.push(pointsRang({mode:"auto"}, r, n));
  return out;
}

function mancheClassee(m){
  return Object.keys(m.rangs || {}).some(function(k){ return m.rangs[k] > 0; });
}

/**
 * Résultats complets d'une épreuve : points de chacun, rôle, pari.
 */
function calculerEpreuve(ep){
  var poids = Number(ep.poids) || 1;
  var parJoueur = {};
  var participants = (ep.participants || []).filter(function(j){ return trouverJoueur(j); });
  var manches = (ep.manches || []).filter(mancheClassee);

  var compteAffilies = {};
  Object.keys(ep.affiliations || {}).forEach(function(a){
    var p = ep.affiliations[a];
    compteAffilies[p] = (compteAffilies[p]||0) + 1;
  });

  // Points bruts d'épreuve, avant bonus et pondération.
  var brut = {}, nbManches = {};
  participants.forEach(function(j){ brut[j] = 0; nbManches[j] = 0; });

  manches.forEach(function(m){
    var N = participants.filter(function(j){ return m.rangs[j] > 0; }).length;
    participants.forEach(function(j){
      var r = m.rangs[j] || 0;
      if (!r) return;
      brut[j] += pointsRang(ep, r, N);
      nbManches[j]++;
    });
  });
  if (ep.cumul === "moyenne"){
    participants.forEach(function(j){ if (nbManches[j] > 1) brut[j] = brut[j] / nbManches[j]; });
  }

  var classee = manches.length > 0;

  // Vainqueur de l'épreuve — sert aux paris. Égalités admises.
  var meilleur = -Infinity, vainqueurs = [];
  if (classee){
    participants.forEach(function(j){
      if (nbManches[j] === 0) return;
      if (brut[j] > meilleur){ meilleur = brut[j]; vainqueurs = [j]; }
      else if (brut[j] === meilleur) vainqueurs.push(j);
    });
  }

  participants.forEach(function(j){
    var bonus = (Number(E.reglages.bonusPorteur)||0) * (compteAffilies[j]||0);
    parJoueur[j] = { pts: nbManches[j] ? arrondir((brut[j] + bonus) * poids) : null,
                     brut: brut[j], bonus: bonus, manches: nbManches[j],
                     role:"joue", porteur:null, pariSur:null, pariGagne:false, gainPari:0 };
  });

  var taux = (Number(E.reglages.tauxHeritage)||0) / 100;
  Object.keys(ep.affiliations || {}).forEach(function(aff){
    var port = ep.affiliations[aff];
    if (!trouverJoueur(aff)) return;
    var src = brut[port] || 0;
    var ok = (nbManches[port] || 0) > 0;
    parJoueur[aff] = { pts: ok ? arrondir(src * taux * poids) : null,
                       brut: src, bonus:0, manches:0,
                       role:"suit", porteur:port, pariSur:null, pariGagne:false, gainPari:0 };
  });

  // Les paris s'ajoutent par-dessus le rôle, quel qu'il soit.
  if (E.reglages.parisActifs){
    Object.keys(ep.paris || {}).forEach(function(jid){
      if (!trouverJoueur(jid)) return;
      var mise = ep.paris[jid];
      if (!parJoueur[jid])
        parJoueur[jid] = { pts:null, brut:0, bonus:0, manches:0, role:"parie",
                           porteur:null, pariSur:mise, pariGagne:false, gainPari:0 };
      parJoueur[jid].pariSur = mise;
      if (!classee) return;
      var gagne = vainqueurs.indexOf(mise) !== -1;
      parJoueur[jid].pariGagne = gagne;
      parJoueur[jid].gainPari = gagne ? (Number(E.reglages.gainPari)||0) : 0;
      parJoueur[jid].pts = arrondir((parJoueur[jid].pts || 0) + parJoueur[jid].gainPari);
    });
  }

  return { parJoueur: parJoueur, classee: classee, vainqueurs: vainqueurs, manches: manches.length };
}

function totaux(exclureId){
  var t = {};
  E.joueurs.forEach(function(j){ t[j.id] = { total:0, detail:{} }; });
  E.epreuves.forEach(function(ep){
    if (exclureId && ep.id === exclureId) return;
    var r = calculerEpreuve(ep);
    Object.keys(r.parJoueur).forEach(function(jid){
      var v = r.parJoueur[jid];
      if (!t[jid]) return;
      t[jid].detail[ep.id] = v;
      if (typeof v.pts === "number") t[jid].total += v.pts;
    });
  });
  Object.keys(t).forEach(function(k){ t[k].total = arrondir(t[k].total); });
  return t;
}

/* Critères de départage, dans l'ordre où on les applique. */
var DEPARTAGES = [
  { cle:"victoires", long:"aux jeux gagnés",            court:"jeux gagnés" },
  { cle:"meilleur",  long:"à la meilleure manche",      court:"meilleure manche" },
  { cle:"joues",     long:"au nombre de jeux disputés", court:"jeux disputés" }
];

function criteresTous(exclureId){
  var c = {};
  E.joueurs.forEach(function(j){ c[j.id] = { victoires:0, meilleur:0, joues:0 }; });
  E.epreuves.forEach(function(x){
    if (exclureId && x.id === exclureId) return;
    var r = calculerEpreuve(x);
    r.vainqueurs.forEach(function(v){ if (c[v]) c[v].victoires++; });
    Object.keys(r.parJoueur).forEach(function(jid){
      if (!c[jid]) return;
      var v = r.parJoueur[jid];
      if (v.pts === null) return;
      if (v.pts > c[jid].meilleur) c[jid].meilleur = v.pts;
      if (v.role === "joue") c[jid].joues++;
    });
  });
  return c;
}

function classement(exclureId){
  var t = totaux(exclureId);
  var c = criteresTous(exclureId);
  var out = E.joueurs.map(function(j){
    return { joueur:j, total:t[j.id].total, detail:t[j.id].detail, crit:c[j.id], departage:null };
  }).sort(function(a,b){
    if (b.total !== a.total) return b.total - a.total;
    for (var i=0;i<DEPARTAGES.length;i++){
      var k = DEPARTAGES[i].cle;
      if (b.crit[k] !== a.crit[k]) return b.crit[k] - a.crit[k];
    }
    return a.joueur.nom.localeCompare(b.joueur.nom, "fr");
  });
  // On dit pourquoi, sinon le salon croit à un tri au hasard.
  for (var i=0; i<out.length-1; i++){
    if (out[i].total !== out[i+1].total) continue;
    var motif = null;
    for (var k=0; k<DEPARTAGES.length; k++){
      var cle = DEPARTAGES[k].cle;
      if (out[i].crit[cle] !== out[i+1].crit[cle]){ motif = DEPARTAGES[k]; break; }
    }
    out[i].departage = { sur: out[i+1].joueur.nom,
                         long: motif ? motif.long : "par ordre alphabétique, faute de mieux",
                         court: motif ? motif.court : "ex æquo" };
  }
  return out;
}

function arrondir(n){
  var d = Math.max(0, Math.min(3, Number(E.reglages.decimales) || 0));
  var f = Math.pow(10, d);
  return Math.round(n * f) / f;
}
function fmt(n){
  if (n === null || n === undefined) return "—";
  var d = Math.max(0, Math.min(3, Number(E.reglages.decimales) || 0));
  return Number(n).toFixed(d);
}

/* ==========================================================================
   4. LECTURE DE COURSE
   ========================================================================== */
function epreuveVedette(){
  var enJeu = null, best = null;
  E.epreuves.forEach(function(ep){
    if (!enJeu && ep.statut === "en_jeu" && calculerEpreuve(ep).classee) enJeu = ep;
  });
  if (enJeu) return enJeu;
  E.epreuves.forEach(function(ep){
    if (ep.statut !== "terminee" || !calculerEpreuve(ep).classee) return;
    if (!best || (ep.rangFin||0) > (best.rangFin||0)) best = ep;
  });
  return best;
}

function mouvements(){
  var notees = E.epreuves.filter(function(ep){ return calculerEpreuve(ep).classee; });
  if (notees.length < 2) return null;
  var v = epreuveVedette();
  if (!v) return null;
  var rangAvant = {};
  classement(v.id).forEach(function(r,i){ rangAvant[r.joueur.id] = i+1; });
  return { epreuve:v, rangAvant:rangAvant };
}

function maxPointsEpreuve(ep){
  var poids = Number(ep.poids) || 1, base;
  if (ep.mode === "manuel"){
    var b = (ep.baremeManuel||[]).map(Number).filter(function(x){ return !isNaN(x); });
    base = b.length ? Math.max.apply(null, b) : 0;
  } else {
    base = (Number(E.reglages.ptsBase)||0) + (Number(E.reglages.ptsEtendue)||0);
  }
  var nbM = Math.max(1, (ep.manches||[]).length);
  if (ep.cumul !== "moyenne") base = base * nbM;
  var cap = (E.reglages.capaciteActive && Number(E.reglages.capaciteAffilies) > 0)
    ? Number(E.reglages.capaciteAffilies) : 0;
  var pari = E.reglages.parisActifs ? (Number(E.reglages.gainPari)||0) : 0;
  return (base + (Number(E.reglages.bonusPorteur)||0) * cap) * poids + pari;
}

function pointsRestants(){
  return E.epreuves.filter(function(ep){ return ep.statut !== "terminee"; })
                   .reduce(function(s, ep){ return s + maxPointsEpreuve(ep); }, 0);
}

function horsCourse(cl){
  var out = {};
  if (!cl.length) return out;
  var reste = pointsRestants(), meneur = cl[0].total;
  cl.forEach(function(r){ out[r.joueur.id] = (r.total + reste) < meneur; });
  return out;
}

function epreuvesRestantes(){
  return E.epreuves.filter(function(ep){ return ep.statut !== "terminee"; }).length;
}

// Le classement général se scelle pour les dernières épreuves.
function estAveugle(){
  var R = E.reglages;
  if (!R.aveugleActif || E.aveugleLeve) return false;
  var finies = E.epreuves.length - epreuvesRestantes();
  if (finies < 1) return false;
  var reste = epreuvesRestantes();
  return reste > 0 && reste <= Number(R.aveugleDernieres);
}

/* ==========================================================================
   5. RÈGLES D'AFFILIATION
   ========================================================================== */
function partenairesDe(jid, override){
  var s = {};
  E.epreuves.forEach(function(ep){
    var aff = (override && override.epreuveId === ep.id) ? override.affiliations : (ep.affiliations || {});
    Object.keys(aff).forEach(function(a){
      var p = aff[a];
      if (a === jid) s[p] = 1;
      else if (p === jid && E.reglages.plafondBidirectionnel) s[a] = 1;
    });
  });
  delete s[jid];
  return Object.keys(s);
}

function blocageAffiliation(ep, affId, portId){
  if (affId === portId) return { texte:"Un joueur ne peut pas se suivre lui-même.", court:"c'est vous" };
  if (ep.participants.indexOf(portId) === -1) return { texte:"Le porteur doit jouer cette épreuve.", court:"ne joue pas" };

  var R = E.reglages;
  if (R.capaciteActive && Number(R.capaciteAffilies) > 0){
    var n = 0;
    Object.keys(ep.affiliations).forEach(function(k){ if (ep.affiliations[k] === portId) n++; });
    if (n >= Number(R.capaciteAffilies))
      return { texte:nomDe(portId)+" accueille déjà "+n+" affilié"+(n>1?"s":"")+" sur "+R.capaciteAffilies+" pour ce jeu.",
               court:"complet" };
  }
  if (R.plafondActif && Number(R.plafondPartenaires) > 0){
    var projet = Object.assign({}, ep.affiliations);
    projet[affId] = portId;
    var ov = { epreuveId: ep.id, affiliations: projet };
    var max = Number(R.plafondPartenaires);
    if (partenairesDe(affId, ov).length > max && partenairesDe(affId).indexOf(portId) === -1)
      return { texte:nomDe(affId)+" a déjà "+max+" coéquipier"+(max>1?"s":"")+" pour la soirée : "+
               partenairesDe(affId).map(nomDe).join(", ")+".", court:"cercle plein" };
    if (R.plafondBidirectionnel && partenairesDe(portId, ov).length > max && partenairesDe(portId).indexOf(affId) === -1)
      return { texte:nomDe(portId)+" a déjà "+max+" coéquipier"+(max>1?"s":"")+" pour la soirée : "+
               partenairesDe(portId).map(nomDe).join(", ")+".", court:"son cercle est plein" };
  }
  return null;
}

function porteursPossibles(ep, affId){
  return ep.participants
    .filter(function(p){ return p !== affId; })
    .map(function(p){ return { id:p, nom:nomDe(p), blocage:blocageAffiliation(ep, affId, p) }; })
    .sort(function(a,b){
      var ba = a.blocage ? 1 : 0, bb = b.blocage ? 1 : 0;
      return ba - bb || a.nom.localeCompare(b.nom,"fr");
    });
}

function misesPossibles(ep, jid){
  return ep.participants
    .filter(function(p){ return p !== jid; })
    .map(function(p){ return { id:p, nom:nomDe(p) }; })
    .sort(function(a,b){ return a.nom.localeCompare(b.nom,"fr"); });
}

function roleDans(ep, jid){
  if (ep.participants.indexOf(jid) !== -1) return "joue";
  if (ep.affiliations[jid]) return "suit";
  return "absent";
}

function pairesAlliance(){
  var m = {};
  E.epreuves.forEach(function(ep){
    Object.keys(ep.affiliations || {}).forEach(function(a){
      var p = ep.affiliations[a];
      if (!trouverJoueur(a) || !trouverJoueur(p)) return;
      var k = [a,p].sort().join("|");
      m[k] = (m[k]||0) + 1;
    });
  });
  return m;
}

/* ==========================================================================
   6. FAITS SAILLANTS
   ========================================================================== */
function faitsSaillants(){
  var f = [], cl = classement(), aveugle = estAveugle();

  var best = null, pari = null, pronos = {};
  E.epreuves.forEach(function(ep){
    var r = calculerEpreuve(ep);
    Object.keys(r.parJoueur).forEach(function(jid){
      var v = r.parJoueur[jid];
      if (v.pts !== null && v.role === "joue" && (!best || v.pts > best.pts))
        best = { pts:v.pts, jid:jid, ep:ep };
      if (v.pts !== null && v.role === "suit" && (!pari || v.pts > pari.pts))
        pari = { pts:v.pts, jid:jid, ep:ep, porteur:v.porteur };
      if (v.pariGagne) pronos[jid] = (pronos[jid]||0) + 1;
    });
  });

  if (best) f.push({ etiq:"Meilleure manche", v:fmt(best.pts), q:nomDe(best.jid), d:best.ep.nom, ton:"" });
  if (pari) f.push({ etiq:"Le pari le plus payant", v:fmt(pari.pts), q:nomDe(pari.jid),
                     d:"a suivi "+nomDe(pari.porteur)+" · "+pari.ep.nom, ton:"pervenche" });

  var topProno = Object.keys(pronos).sort(function(a,b){ return pronos[b]-pronos[a]; })[0];
  if (topProno) f.push({ etiq:"Meilleur pronostiqueur", v:String(pronos[topProno]), q:nomDe(topProno),
                         d:"pronostic"+(pronos[topProno]>1?"s":"")+" réussi"+(pronos[topProno]>1?"s":""), ton:"rose" });

  var porte = {};
  E.epreuves.forEach(function(ep){
    Object.keys(ep.affiliations||{}).forEach(function(a){ porte[ep.affiliations[a]] = (porte[ep.affiliations[a]]||0)+1; });
  });
  var topPorte = Object.keys(porte).sort(function(a,b){ return porte[b]-porte[a]; })[0];
  if (topPorte) f.push({ etiq:"Le plus recherché", v:String(porte[topPorte]), q:nomDe(topPorte),
                         d:"fois porte-drapeau ce soir", ton:"pervenche" });

  var pa = pairesAlliance();
  var topPaire = Object.keys(pa).sort(function(a,b){ return pa[b]-pa[a]; })[0];
  if (topPaire && pa[topPaire] > 1){
    var duo = topPaire.split("|");
    f.push({ etiq:"Duo le plus soudé", v:String(pa[topPaire]), q:nomDe(duo[0])+" & "+nomDe(duo[1]),
             d:"jeux côte à côte", ton:"pervenche" });
  }

  // Ces deux-là révéleraient le classement général : muets en mode aveugle.
  if (!aveugle && cl.length >= 2){
    var duel = null;
    for (var i=0; i<cl.length-1; i++){
      var ecart = arrondir(cl[i].total - cl[i+1].total);
      if (!duel || ecart < duel.ecart) duel = { ecart:ecart, a:cl[i], b:cl[i+1], place:i+1 };
    }
    if (duel && (duel.a.total > 0 || duel.b.total > 0))
      f.push({ etiq:"Lutte la plus serrée", v:fmt(duel.ecart),
               q:duel.a.joueur.nom+" / "+duel.b.joueur.nom,
               d:"points d'écart pour la "+duel.place+(duel.place===1?"re":"e")+" place", ton:"sauge" });
  }
  var nbReste = epreuvesRestantes();
  if (!aveugle && nbReste > 0 && cl.length)
    f.push({ etiq:"Encore en jeu", v:fmt(pointsRestants()), q:nbReste+" jeu"+(nbReste>1?"x":"")+" à venir",
             d:"points maximum encore atteignables", ton:"sauge" });

  if (E.reglages.chronoActif){
    var total = E.epreuves.reduce(function(s,ep){
      return s + ((ep.debutA && ep.finA) ? (ep.finA - ep.debutA) : 0);
    }, 0);
    if (total > 0) f.push({ etiq:"Temps de jeu", v:dureeTexte(total), q:"cumulés ce soir",
                            d:"sans compter les pauses entre les jeux", ton:"sauge" });
  }
  return f;
}

/* ==========================================================================
   7. ARCHIVES ET LIGUE
   ========================================================================== */
function lireArchives(){
  try { var a = JSON.parse(Stockage.lire(CLE_ARCHIVES) || "[]"); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function ecrireArchives(a){ Stockage.ecrire(CLE_ARCHIVES, JSON.stringify(a)); }

function archiverSoiree(){
  var cl = classement();
  if (!cl.length) return false;
  var a = lireArchives();
  a.unshift({
    id: id(),
    nom: E.nom,
    date: new Date().toISOString().slice(0,10),
    nbJeux: E.epreuves.filter(function(x){ return calculerEpreuve(x).classee; }).length,
    classement: cl.map(function(r){ return { nom:r.joueur.nom, total:r.total }; })
  });
  ecrireArchives(a.slice(0, 60));
  return true;
}

// Cumul par nom : c'est le seul identifiant stable d'une soirée à l'autre.
function ligue(inclureCourante){
  var t = {};
  function ajouter(nom, pts, place){
    var k = nom.trim().toLowerCase();
    if (!t[k]) t[k] = { nom:nom.trim(), total:0, soirees:0, victoires:0, podiums:0 };
    t[k].total += pts; t[k].soirees++;
    if (place === 1) t[k].victoires++;
    if (place <= 3) t[k].podiums++;
  }
  lireArchives().forEach(function(s){
    s.classement.forEach(function(r,i){ ajouter(r.nom, Number(r.total)||0, i+1); });
  });
  if (inclureCourante){
    var cl = classement();
    if (cl.length && cl[0].total > 0) cl.forEach(function(r,i){ ajouter(r.joueur.nom, r.total, i+1); });
  }
  return Object.keys(t).map(function(k){ return t[k]; })
    .sort(function(a,b){ return b.total - a.total || b.victoires - a.victoires || a.nom.localeCompare(b.nom,"fr"); });
}

/* ==========================================================================
   9. OUTILS
   ========================================================================== */
function trouverJoueur(jid){
  for (var i=0;i<E.joueurs.length;i++) if (E.joueurs[i].id === jid) return E.joueurs[i];
  return null;
}
function nomDe(jid){ var j = trouverJoueur(jid); return j ? j.nom : "?"; }
function couleurDe(jid){ var j = trouverJoueur(jid); return j ? j.couleur : "#666"; }
function initiales(nom){
  var m = String(nom||"").trim().split(/\s+/);
  return ((m[0]||"?")[0] + (m[1] ? m[1][0] : "")).toUpperCase();
}
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
// Valeur calculée d'un jeton CSS. Le canvas et les attributs de
// présentation SVG ne comprennent pas var() : on la leur résout.
function jetonCSS(nom, secours){
  try {
    var v = getComputedStyle(document.documentElement).getPropertyValue(nom).trim();
    return v || secours;
  } catch(e){ return secours; }
}

function jeton(jid, gros){
  return '<span class="jeton'+(gros?' gros':'')+'" style="background:'+esc(couleurDe(jid))+'">'+
         esc(initiales(nomDe(jid)))+'</span>';
}
function badgeDelta(d){
  if (d === null || d === undefined) return "";
  if (d > 0)  return '<span class="delta monte">&#9650; '+d+'</span>';
  if (d < 0)  return '<span class="delta descend">&#9660; '+Math.abs(d)+'</span>';
  return '<span class="delta stable">&#8212;</span>';
}
function dureeTexte(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), r = s%60;
  if (h) return h + " h " + (m<10?"0":"") + m;
  return m + ":" + (r<10?"0":"") + r;
}
function nombre(v){
  var n = Number(String(v).replace(",", "."));
  return isNaN(n) ? 0 : n;
}
function ep(epId){
  for (var i=0;i<E.epreuves.length;i++) if (E.epreuves[i].id === epId) return E.epreuves[i];
  return null;
}
/* Un œillet, un titre déclaratif, un mot en italique : la structure
   éditoriale de GameCrawler, transposée à l'application. */
function entete(oeil, titre, sous){
  return '<div class="entete"><span class="oeil">'+esc(oeil)+'</span><h2>'+titre+'</h2>'+
         (sous ? '<p class="sous">'+sous+'</p>' : '')+'</div>';
}

var LIB_STATUT = { a_venir:"À venir", declarations:"Déclarations ouvertes", en_jeu:"En jeu", terminee:"Terminée" };

// Les trois premiers d'un jeu, participants et affiliés confondus.
function podium(x, combien){
  var r = calculerEpreuve(x);
  return Object.keys(r.parJoueur)
    .filter(function(k){ return r.parJoueur[k].pts !== null && r.parJoueur[k].role !== "parie"; })
    .sort(function(a,b){
      return r.parJoueur[b].pts - r.parJoueur[a].pts || nomDe(a).localeCompare(nomDe(b),"fr");
    })
    .slice(0, combien || 3)
    .map(function(k){ return { jid:k, v:r.parJoueur[k] }; });
}

function blason(x, taille, classe){
  var src = apercuDe(x);
  if (src) return '<span class="blason '+(classe||'')+'"><img src="'+esc(src)+'" alt="" loading="lazy"></span>';
  return '<span class="blason '+(classe||'')+'" style="background:'+esc(x.teinte)+'22;color:'+esc(x.teinte)+'">'+
         svgIcone(x.icone, taille)+'</span>';
}

function indexManche(x){
  var i = mancheActive[x.id];
  if (i === undefined || i < 0 || i >= x.manches.length) i = x.manches.length - 1;
  return i;
}

var VUES = [
  { id:"tournoi",     lib:"Jeux",       g:"\u25A6" },

  { id:"deroulement", lib:"En jeu",     g:"\u25B6" },
  { id:"joueurs",     lib:"Joueurs",    g:"\u25CF" },
  { id:"reglages",    lib:"Réglages",   g:"\u2699" }
];

function rendre(){
  if (MIROIR){ rendreTV(); return; }

  var actif = document.activeElement;
  var cle = actif && actif.dataset ? actif.dataset.focus : null;
  var debut = actif && actif.selectionStart != null ? actif.selectionStart : null;

  document.getElementById("titre-appli").textContent = E.nom || "Tournoi maison";
  var finies = E.epreuves.length - epreuvesRestantes();
  document.getElementById("cadence").textContent =
    E.epreuves.length ? finies + " / " + E.epreuves.length + " jeux" : "";

  document.getElementById("onglets").innerHTML = VUES.map(function(v){
    return '<button data-onglet="'+v.id+'" aria-current="'+(E.onglet===v.id)+'">'+
           '<span class="g">'+v.g+'</span>'+v.lib+'</button>';
  }).join("");

  document.getElementById("vue-tournoi").innerHTML     = vueTournoi();
  document.getElementById("vue-classement").innerHTML  = vueClassement();
  document.getElementById("vue-deroulement").innerHTML = vueDeroulement();
  document.getElementById("vue-joueurs").innerHTML     = vueJoueurs();
  document.getElementById("vue-reglages").innerHTML    = vueReglages();
  VUES.forEach(function(v){
    document.getElementById("vue-"+v.id).classList.toggle("actif", E.onglet === v.id);
  });

  if (document.getElementById("tv").classList.contains("actif")) rendreTV();

  if (cle){
    var cible = document.querySelector('[data-focus="'+cle+'"]');
    if (cible){
      cible.focus();
      if (debut != null && cible.setSelectionRange){ try { cible.setSelectionRange(debut, debut); } catch(e){} }
    }
  }
  sauvegarder();
}

/* ---------- Vue : les jeux ---------- */
function vueTournoi(){
  if (epreuveOuverte){
    var e = ep(epreuveOuverte);
    if (e) return panneauEpreuve(e);
    epreuveOuverte = null;
  }
  if (choixPreset) return catalogueJeux();

  var h = entete("Le programme", "Ce qu'on <em>joue</em>.",
    E.epreuves.length ? "Touchez une tuile pour aller la jouer, l'engrenage pour ses réglages." : null);

  if (!E.epreuves.length){
    return h + '<div class="carte"><div class="vide-etat"><strong>Rien au programme.</strong>'+
      'Choisissez vos jeux dans le catalogue : Mario Kart, Catan, baby-foot, dards&hellip; chacun devient une manche notée à part.'+
      '<div style="margin-top:18px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">'+
      '<button class="btn primaire" data-act="ouvrir-preset">Ouvrir le catalogue</button>'+
      '<button class="btn" data-act="exemple">Soirée d\'exemple</button></div></div></div>';
  }

  h += '<div class="grille-jeux">' + E.epreuves.map(function(x){
    var p = podium(x, 3);
    var nbM = (x.manches||[]).length;
    var ap = apercuDe(x);
    var t = '<button class="tuile-jeu" data-act="aller-jeu" data-ep="'+x.id+'">'+
      (ap ? '<img class="fond-jeu" src="'+esc(ap)+'" alt="" loading="lazy">' : '')+
      '<div class="halo" style="background:'+esc(x.teinte)+'"></div>'+ blason(x, 30)+
      '<div><div class="nom-jeu">'+esc(x.nom)+'</div><div class="etat-jeu">'+LIB_STATUT[x.statut]+
        (nbM>1 ? ' &middot; '+nbM+' manches' : '') + (Number(x.poids)!==1 ? ' &middot; &#215;'+esc(x.poids) : '')+
      '</div></div><div class="podium-mini">';
    if (p.length){
      t += p.map(function(o,i){
        return '<span class="pl'+(o.v.role==="suit"?" suit":"")+'"><span class="n">'+(i+1)+'</span>'+
          '<span class="q">'+esc(nomDe(o.jid))+(o.v.role==="suit"?' &#8627;':'')+'</span>'+
          '<span class="p">'+fmt(o.v.pts)+'</span></span>';
      }).join("");
    } else {
      t += '<span class="creux">'+(x.statut==="declarations"
        ? x.participants.length+' inscrit'+(x.participants.length>1?'s':'')+
          ', '+Object.keys(x.affiliations).length+' affilié'+(Object.keys(x.affiliations).length>1?'s':'')
        : 'Podium à venir')+'</span>';
    }
    t += '</div></button><button class="reglage-jeu" data-act="ouvrir-epreuve" data-ep="'+x.id+'" '+
         'aria-label="Réglages de '+esc(x.nom)+'">&#9881;</button>';
    return '<div style="position:relative">'+t+'</div>';
  }).join("") +
  '<button class="tuile-jeu tuile-ajout" data-act="ouvrir-preset">'+
    '<span class="plus">+</span><span style="font-size:.84rem;font-weight:650">Ajouter un jeu</span></button></div>';

  h += '<div class="petit sourdine">&#8627; signale un podium obtenu par affiliation.</div>';
  return h;
}

function catalogueJeux(){

    '<div class="petit sourdine" style="margin-top:8px">Vous choisirez son pictogramme, ses manches et son poids ensuite.</div></div>';

  h += PRESETS.map(function(f){
    return '<div class="famille"><span class="etiq">'+esc(f.cat)+'</span><div class="grille-presets">'+
      f.jeux.map(function(g){
        var deja = E.epreuves.some(function(x){ return x.nom === g.nom; });
        return '<button class="preset" data-act="ajouter-preset" data-nom="'+esc(g.nom)+'" data-icone="'+esc(g.icone)+'" '+

      }).join("")+'</div></div>';
  }).join("");
  return h;
