    'Le motif s\'affiche à côté du joueur, pour que personne ne croie à un tri au hasard. '+
    'Si tout est identique, l\'application le dit franchement plutôt que de trancher en silence.</div></div>';

  h += '<h2 class="titre">Paris de salon</h2><div class="carte">'+
    '<label class="bascule"><input type="checkbox" data-act="r-bool" data-k="parisActifs"'+(R.parisActifs?' checked':'')+'>'+
    '<span><strong>Activer les paris</strong><br><span class="petit sourdine">'+
    'Avant chaque jeu, n\'importe qui peut miser sur le vainqueur &#8212; y compris un joueur qui participe, tant qu\'il ne mise pas sur lui-même. '+
    'Ça donne quelque chose à faire aux spectateurs.</span></span></label>'+
    (R.parisActifs ? '<label class="champ"><span class="nom">Points d\'un bon pronostic</span>'+
      '<input type="number" step="any" min="0" value="'+esc(R.gainPari)+'" data-act="r-num" data-k="gainPari" data-focus="r-gainPari">'+
      '<span class="aide">Versés tels quels, sans pondération par le poids du jeu.</span></label>' : '')+'</div>';

  h += '<h2 class="titre">Suspense</h2><div class="carte">'+
    '<label class="bascule"><input type="checkbox" data-act="r-bool" data-k="aveugleActif"'+(R.aveugleActif?' checked':'')+'>'+
    '<span><strong>Sceller le classement en fin de soirée</strong><br><span class="petit sourdine">'+
    'Les points continuent d\'être comptés, mais le classement général disparaît des écrans jusqu\'à la révélation.</span></span></label>'+
    (R.aveugleActif ? '<label class="champ"><span class="nom">Sceller pendant les derniers jeux</span>'+
      '<input type="number" min="1" max="9" step="1" value="'+esc(R.aveugleDernieres)+'" data-act="r-num" data-k="aveugleDernieres" data-focus="r-aveugleDernieres">'+
      '<span class="aide">Le sceau s\'active quand il ne reste plus que ce nombre de jeux.</span></label>' : '')+
    (E.aveugleLeve ? '<div class="petit sourdine">Le sceau a été brisé pour cette soirée. '+
      '<button class="btn lien" data-act="resceller">Le remettre</button></div>' : '')+'</div>';

  h += '<h2 class="titre">Chronomètre</h2><div class="carte">'+
    '<label class="bascule"><input type="checkbox" data-act="r-bool" data-k="chronoActif"'+(R.chronoActif?' checked':'')+'>'+
    '<span><strong>Mesurer la durée de chaque jeu</strong><br><span class="petit sourdine">'+
    'Optionnel. Démarre au lancement, s\'arrête à la clôture. Sert surtout à corriger les poids d\'une soirée à l\'autre.</span></span></label></div>';

  h += '<h2 class="titre">Données</h2><div class="carte">'+
    '<p class="petit sourdine" style="margin-top:0">'+(Stockage.dispo
      ? 'Tout est enregistré dans ce navigateur au fil de la saisie. Exportez avant de changer d\'appareil.'
      : 'La sauvegarde locale est bloquée ici. Exportez régulièrement, ou téléchargez ce fichier et ouvrez-le directement.')+'</p>'+
    '<div class="rangee" style="gap:9px;flex-wrap:wrap">'+
      '<button class="btn" data-act="exporte">Exporter en JSON</button>'+
      '<button class="btn" data-act="importe">Importer un fichier</button>'+
      '<button class="btn danger pousse" data-act="reinit">Tout effacer</button></div>'+
    '<input type="file" id="fichier-import" accept="application/json,.json" hidden></div>';

  return h + '<div class="petit sourdine" style="text-align:center;padding:10px 0 20px">'+
    'Tourneo &middot; fonctionne hors ligne, aucune donnée ne quitte l\'appareil.</div>';
}

/* ==========================================================================
   11. AFFICHAGE TV
   ========================================================================== */
var DUREE_PANNEAU = 13000;
var iPanneau = 0, tvPause = false, minuterieTV = null;

function panneauxDisponibles(){
  var p = [{ id:"classement", lib: estAveugle() ? "Classement scellé" : "Classement général" }];
  var v = epreuveVedette();
  if (v) p.push({ id:"derniere", lib:v.nom, ep:v });
  if (E.epreuves.length) p.push({ id:"jeux", lib:"Le tableau des jeux" });
  if (Object.keys(pairesAlliance()).length) p.push({ id:"alliances", lib:"Le réseau d'alliances" });
  if (faitsSaillants().length) p.push({ id:"saillants", lib:"Faits saillants" });
  return p;
}

function rendreTV(){
  var dispo = panneauxDisponibles();
  if (iPanneau >= dispo.length) iPanneau = 0;
  var p = dispo[iPanneau] || dispo[0];
  var corps = document.getElementById("tv-corps");

  var finies = E.epreuves.length - epreuvesRestantes();
  var aVenir = null;
  E.epreuves.forEach(function(e){ if (!aVenir && e.statut === "declarations") aVenir = e; });
  if (!aVenir) E.epreuves.forEach(function(e){ if (!aVenir && e.statut === "a_venir") aVenir = e; });

  document.getElementById("tv-titre").textContent = p ? p.lib : (E.nom || "Classement");
  document.getElementById("tv-sous").textContent =
    (E.nom ? E.nom.toUpperCase() + " · " : "") + finies + " / " + E.epreuves.length + " jeux" +
    (aVenir ? " · à suivre : " + aVenir.nom : "");
  document.getElementById("tv-points").innerHTML =
    dispo.map(function(x,i){ return '<span class="'+(i===iPanneau?'on':'')+'"></span>'; }).join("");

  var avant = {};
  Array.prototype.forEach.call(corps.querySelectorAll("[data-jid]"), function(el){
    avant[el.getAttribute("data-jid")] = el.getBoundingClientRect().top;
  });

  if (!p) corps.innerHTML = '<div class="tv-vide">Ajoutez des joueurs pour lancer le classement.</div>';
  else if (p.id === "classement") corps.innerHTML = tvClassement();
  else if (p.id === "derniere")   corps.innerHTML = tvDerniere(p.ep);
  else if (p.id === "jeux")       corps.innerHTML = tvJeux();
  else if (p.id === "alliances")  corps.innerHTML = tvAlliances();
  else                            corps.innerHTML = tvSaillants();

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && corps.querySelector("[data-jid]")){
    Array.prototype.forEach.call(corps.querySelectorAll("[data-jid]"), function(el){
      var a = avant[el.getAttribute("data-jid")];
      if (a === undefined) return;
      var d = a - el.getBoundingClientRect().top;
      if (Math.abs(d) < 2 || !el.animate) return;
      el.animate([{ transform:"translateY("+d+"px)" }, { transform:"translateY(0)" }],
                 { duration:560, easing:"cubic-bezier(.2,.7,.3,1)" });
    });
  }
  relancerProgres();
}

function tvClassement(){
  if (estAveugle()){
    var reste = epreuvesRestantes();
    return '<div class="tv-vide"><div><div class="sceau">&#9878;</div><b>Classement scellé</b>'+
      'Il reste '+reste+' jeu'+(reste>1?'x':'')+'. Les points s\'accumulent en silence.</div></div>';
  }
  var cl = classement();
  if (!cl.length) return '<div class="tv-vide">Ajoutez des joueurs pour lancer le classement.</div>';
  var tete = cl[0].total, mv = mouvements(), hc = horsCourse(cl);
  return '<div class="tv-grille">' + cl.slice(0,12).map(function(r,i){
    var largeur = tete > 0 ? Math.max(0,(r.total/tete)*100) : 0;
    var d = mv ? (mv.rangAvant[r.joueur.id] - (i+1)) : null;
    var ecart = r.departage ? '<span style="color:var(--laiton)">= '+esc(r.departage.court)+'</span>'
             : (i === 0 ? "" : "&#8722;" + fmt(arrondir(tete - r.total)));
    return '<div class="tv-l'+(i===0 && r.total>0?' tete':'')+(hc[r.joueur.id]?' horscourse':'')+'" data-jid="'+r.joueur.id+'">'+
      '<div class="jauge" style="width:'+largeur+'%"></div>'+
      '<span class="place">'+(i+1)+'</span>'+ badgeDelta(d) + jeton(r.joueur.id, true)+
      '<span class="nom">'+esc(r.joueur.nom)+'</span><span class="ecart">'+ecart+'</span>'+
      '<span class="total">'+fmt(r.total)+'</span></div>';
  }).join("") + '</div>';
}

function tvDerniere(x){
  var r = calculerEpreuve(x);
  var liste = Object.keys(r.parJoueur)
    .filter(function(k){ return r.parJoueur[k].pts !== null; })
    .sort(function(a,b){ return r.parJoueur[b].pts - r.parJoueur[a].pts; });
  if (!liste.length) return '<div class="tv-vide">Résultats à venir.</div>';
  return '<div class="tv-liste">' + liste.slice(0,12).map(function(jid, i){
    var v = r.parJoueur[jid];
    var cls = v.role === "suit" ? " suit" : (v.role === "parie" ? " parie" : "");
    var marque = v.role === "suit" ? "&#8627;" : (v.role === "parie" ? "&#9733;" : String(i+1));
    var note = "";
    if (v.role === "suit") note = ' <span class="sourdine" style="font-weight:400">a suivi '+esc(nomDe(v.porteur))+'</span>';
    else if (v.role === "parie") note = ' <span class="sourdine" style="font-weight:400">pronostic gagnant</span>';
    else if (v.gainPari) note = ' <span class="sourdine" style="font-weight:400">+'+fmt(v.gainPari)+' pronostic</span>';
    else if (v.bonus) note = ' <span class="sourdine" style="font-weight:400">+'+fmt(v.bonus)+' porteur</span>';
    return '<div class="tv-r'+cls+'" data-jid="d-'+jid+'"><span class="rg">'+marque+'</span>'+ jeton(jid, true)+
      '<span class="nm">'+esc(nomDe(jid))+note+'</span><span class="pt">'+fmt(v.pts)+'</span></div>';
  }).join("") + '</div>';
}

function tvJeux(){
  if (!E.epreuves.length) return '<div class="tv-vide">Aucun jeu au programme.</div>';
  return '<div class="tv-jeux">' + E.epreuves.map(function(x){
    var p = podium(x, 3);
    var c = '<div class="tv-jeu"><div class="en">'+ blason(x, 22, 'mini')+
      '<span class="nm">'+esc(x.nom)+'</span>'+
      (Number(x.poids)!==1 ? '<span class="creux">&#215;'+esc(x.poids)+'</span>' : '')+'</div>';
    if (p.length){
      c += p.map(function(o,i){
        return '<span class="pl'+(o.v.role==="suit"?" suit":"")+'"><span class="n">'+(i+1)+'</span>'+
          '<span class="q">'+esc(nomDe(o.jid))+(o.v.role==="suit"?' &#8627;':'')+'</span></span>';
      }).join("");
    } else c += '<span class="creux">'+LIB_STATUT[x.statut]+'</span>';
    return c + '</div>';
  }).join("") + '</div>';
}

/* Chaque joueur sur un cercle, une corde par équipe formée.
   L'épaisseur dit combien de fois le duo a joué ensemble. */
function tvAlliances(){
  var js = E.joueurs, n = js.length;
  if (n < 2) return '<div class="tv-vide">Il faut au moins deux joueurs.</div>';
  var paires = pairesAlliance(), cles = Object.keys(paires);
  if (!cles.length) return '<div class="tv-vide">Aucune équipe formée pour l\'instant.</div>';

  var W = 1000, H = 600, cx = 500, cy = 300, R = 200, pos = {};
  js.forEach(function(j,i){
    var a = -Math.PI/2 + i*2*Math.PI/n;
    pos[j.id] = { x: cx + R*Math.cos(a), y: cy + R*Math.sin(a), a:a };
  });
  var maxN = Math.max.apply(null, cles.map(function(k){ return paires[k]; }));
  var s = '<svg class="tv-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Réseau des alliances">';

  cles.forEach(function(k){
    var duo = k.split("|"), a = duo[0], b = duo[1], cnt = paires[k];
    if (!pos[a] || !pos[b]) return;
    s += '<path d="M'+pos[a].x.toFixed(1)+' '+pos[a].y.toFixed(1)+' Q'+cx+' '+cy+' '+
         pos[b].x.toFixed(1)+' '+pos[b].y.toFixed(1)+'" fill="none" stroke="'+jetonCSS("--color-cool","#84B4EA")+'" stroke-width="'+
         (3 + (cnt/maxN)*11).toFixed(1)+'" stroke-linecap="round" opacity="'+(0.3 + 0.5*cnt/maxN).toFixed(2)+'"/>';
  });
  js.forEach(function(j){
    var p = pos[j.id];
    var liens = partenairesDe(j.id).length;
    var lx = cx + (p.x-cx)*1.17, ly = cy + (p.y-cy)*1.17;
    var cosA = Math.cos(p.a);
    var anc = cosA > 0.3 ? "start" : (cosA < -0.3 ? "end" : "middle");
    s += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="21" fill="'+esc(j.couleur)+'"/>'+
      '<text x="'+p.x.toFixed(1)+'" y="'+(p.y+6).toFixed(1)+'" text-anchor="middle" font-family="system-ui,sans-serif" '+
      'font-size="17" font-weight="800" fill="'+jetonCSS("--color-bg","#0F0D12")+'">'+esc(initiales(j.nom))+'</text>'+
      '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anc+'" dominant-baseline="middle" '+
      'font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="'+jetonCSS("--color-fg","#F3EEE9")+'">'+esc(j.nom)+'</text>'+
      '<text x="'+lx.toFixed(1)+'" y="'+(ly+22).toFixed(1)+'" text-anchor="'+anc+'" dominant-baseline="middle" '+
      'font-family="system-ui,sans-serif" font-size="15" fill="'+jetonCSS("--color-muted","#9C90A6")+'">'+liens+' lien'+(liens>1?'s':'')+'</text>';
  });
  return s + '</svg>';
}

function tvSaillants(){
  var fs = faitsSaillants();
  if (!fs.length) return '<div class="tv-vide">Les faits saillants arrivent après le premier jeu.</div>';
  return '<div class="tv-podium">' + fs.map(function(f){
    return '<div class="tv-carte '+f.ton+'"><span class="etiq">'+esc(f.etiq)+'</span>'+
      '<div class="gros">'+esc(f.v)+'</div><div class="qui">'+esc(f.q)+'</div>'+
      '<div class="quoi">'+esc(f.d)+'</div></div>';
  }).join("") + '</div>';
}

function relancerProgres(){
  var barre = document.getElementById("tv-progres");
  barre.classList.remove("court");
  void barre.offsetWidth;
  barre.style.animationDuration = (DUREE_PANNEAU/1000) + "s";
  barre.classList.add("court");
  barre.style.animationPlayState = tvPause ? "paused" : "running";
  clearTimeout(minuterieTV);
  if (!tvPause) minuterieTV = setTimeout(function(){ changerPanneau(1); }, DUREE_PANNEAU);
}
function changerPanneau(d){
  var n = panneauxDisponibles().length || 1;
  iPanneau = ((iPanneau + d) % n + n) % n;
  rendreTV();
}
var tv = document.getElementById("tv");
function ouvrirTV(){
  tv.classList.add("actif");
  iPanneau = 0;
  rendreTV();
  if (!MIROIR){ try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); } catch(e){} }
}
function fermerTV(){
  if (MIROIR) return;
  tv.classList.remove("actif");
  clearTimeout(minuterieTV);
  try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch(e){}
}

/* ==========================================================================
   12. RÉCAPITULATIF PARTAGEABLE
   Dessiné directement au canvas plutôt que via SVG : pas de dépendance à
   la sérialisation, pas de canvas taché, ça marche partout.
   ========================================================================== */
function coinsArrondis(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}
function tronquer(c, texte, largeur){
  if (c.measureText(texte).width <= largeur) return texte;
  var t = texte;
  while (t.length > 1 && c.measureText(t + "…").width > largeur) t = t.slice(0, -1);
  return t + "…";
}

function dessinerRecap(){
  var W = 1080, H = 1500;
  var cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  var c = cv.getContext("2d");
  var S = "system-ui,-apple-system,'Segoe UI',Roboto,sans-serif";
  var M = "ui-monospace,Menlo,Consolas,monospace";

  var T = {
    bg:     jetonCSS("--color-bg","#0F0D12"),
    surf:   jetonCSS("--color-surface","#191620"),
    bord:   jetonCSS("--color-border-soft","#241E2C"),
    fg:     jetonCSS("--color-fg","#F3EEE9"),
    muet:   jetonCSS("--color-muted","#9C90A6"),
    ember:  jetonCSS("--color-ember","#F5903C"),
    emberD: jetonCSS("--color-ember-dim","#7A4A18"),
    cool:   jetonCSS("--color-cool","#84B4EA"),
    moss:   jetonCSS("--color-moss","#86C39B"),
    rose:   jetonCSS("--color-rose","#E58BB4"),
    argent: jetonCSS("--color-silver","#C6CBD4"),
    bronze: jetonCSS("--color-bronze","#C08A55")
  };

  c.fillStyle = T.bg;    c.fillRect(0,0,W,H);
  c.fillStyle = T.surf;  c.fillRect(0,0,W,10);
  c.fillStyle = T.ember; c.fillRect(0,0,W*0.38,10);

  var y = 96;
  c.fillStyle = T.muet; c.font = "700 26px "+S;
  c.fillText(new Date().toLocaleDateString("fr-CA", {year:"numeric", month:"long", day:"numeric"}).toUpperCase(), 72, y);
  y += 62;
  c.fillStyle = T.fg; c.font = "800 60px "+S;
  c.fillText(tronquer(c, E.nom || "Tournoi maison", W-144), 72, y);

  var cl = classement();
  var jouees = E.epreuves.filter(function(x){ return calculerEpreuve(x).classee; });
  y += 34;
  c.fillStyle = T.muet; c.font = "600 27px "+S;
  c.fillText(cl.length + " joueurs · " + jouees.length + " jeux disputés", 72, y);

  // Podium
  y += 56;
  var hauteurs = [190, 150, 128];
  var tons = [T.ember, T.argent, T.bronze];
  for (var i=0; i<Math.min(3, cl.length); i++){
    var hh = hauteurs[i];
    coinsArrondis(c, 72, y, W-144, hh, 22);
    c.fillStyle = T.surf; c.fill();
    c.strokeStyle = i===0 ? T.emberD : T.bord; c.lineWidth = 2; c.stroke();

    c.fillStyle = tons[i]; c.font = "800 " + (i===0?76:56) + "px " + M;
    c.fillText(String(i+1), 108, y + hh/2 + (i===0?26:19));

    c.beginPath();
    c.arc(230, y + hh/2, i===0?42:34, 0, Math.PI*2);
    c.fillStyle = cl[i].joueur.couleur; c.fill();
    c.fillStyle = T.bg; c.font = "800 " + (i===0?32:26) + "px " + S;
    c.textAlign = "center";
    c.fillText(initiales(cl[i].joueur.nom), 230, y + hh/2 + (i===0?11:9));
    c.textAlign = "left";

    c.fillStyle = T.fg; c.font = "750 " + (i===0?52:42) + "px " + S;
    c.fillText(tronquer(c, cl[i].joueur.nom, 480), 292, y + hh/2 + (i===0?18:15));

    c.fillStyle = i===0 ? T.ember : T.fg; c.font = "800 " + (i===0?70:52) + "px " + M;
    c.textAlign = "right";
    c.fillText(fmt(cl[i].total), W-108, y + hh/2 + (i===0?25:19));
    c.textAlign = "left";
    y += hh + 14;
  }

  // Reste du classement
  if (cl.length > 3){
    y += 18;
    c.fillStyle = T.muet; c.font = "700 23px "+S;
    c.fillText("SUITE DU CLASSEMENT", 72, y);
    y += 26;
    for (var k=3; k<Math.min(cl.length, 10); k++){
      y += 46;
      c.fillStyle = T.muet; c.font = "700 30px "+M;
      c.fillText(String(k+1), 76, y);
      c.fillStyle = T.fg; c.font = "650 31px "+S;
      c.fillText(tronquer(c, cl[k].joueur.nom, 560), 140, y);
      c.fillStyle = T.muet; c.font = "700 31px "+M;
      c.textAlign = "right"; c.fillText(fmt(cl[k].total), W-76, y); c.textAlign = "left";
    }
    y += 22;
  }

  // Faits saillants
  var fs = faitsSaillants().slice(0, 3);
  if (fs.length){
    y += 40;
    c.fillStyle = T.muet; c.font = "700 23px "+S;
    c.fillText("FAITS SAILLANTS", 72, y);
    y += 20;
    var largeur = (W - 144 - 24) / Math.max(fs.length,1);
    var couleurs = { "":T.ember, pervenche:T.cool, sauge:T.moss, rose:T.rose };
    fs.forEach(function(f, n){
      var x = 72 + n*(largeur+12);
      coinsArrondis(c, x, y, largeur, 156, 18);
      c.fillStyle = T.surf; c.fill();
      c.strokeStyle = T.bord; c.lineWidth = 2; c.stroke();
      c.fillStyle = T.muet; c.font = "700 17px "+S;
      c.fillText(tronquer(c, f.etiq.toUpperCase(), largeur-36), x+20, y+38);
      c.fillStyle = couleurs[f.ton] || T.ember; c.font = "800 46px "+M;
      c.fillText(tronquer(c, String(f.v), largeur-36), x+20, y+88);
      c.fillStyle = T.fg; c.font = "700 25px "+S;
      c.fillText(tronquer(c, f.q, largeur-36), x+20, y+124);
    });
    y += 178;
  }

  // Vainqueurs par jeu
  if (jouees.length){
    y += 34;
    c.fillStyle = T.muet; c.font = "700 23px "+S;
    c.fillText("VAINQUEURS PAR JEU", 72, y);
    y += 14;
    jouees.slice(0, 8).forEach(function(x){
      y += 44;
      var p = podium(x, 1)[0];
      c.beginPath(); c.arc(90, y-9, 13, 0, Math.PI*2);
      c.fillStyle = x.teinte; c.fill();
      c.fillStyle = T.fg; c.font = "650 28px "+S;
      c.fillText(tronquer(c, x.nom, 460), 118, y);
      c.fillStyle = T.ember; c.font = "700 28px "+S;
      c.textAlign = "right";
      c.fillText(tronquer(c, p ? nomDe(p.jid) : "—", 380), W-76, y);
      c.textAlign = "left";
    });
  }

  c.fillStyle = T.bord; c.font = "600 22px "+S;
  c.textAlign = "center";
  c.fillText("Tourneo", W/2, H-46);
  c.textAlign = "left";

  return cv.toDataURL("image/png");
}

function ouvrirRecap(){
  if (!E.joueurs.length){ alert("Ajoutez des joueurs avant de générer un récapitulatif."); return; }
  if (estAveugle() && !confirm("Le classement est encore scellé. Le récapitulatif affichera tous les totaux.\n\nLe générer quand même ?")) return;
  var url;
  try { url = dessinerRecap(); }
  catch(e){ alert("Le récapitulatif n'a pas pu être dessiné dans ce navigateur."); return; }
  document.getElementById("recap-img").src = url;
  document.getElementById("recap").classList.add("actif");
}

/* ==========================================================================
   13. ACTIONS
   ========================================================================== */
function reindexerRangs(m){
  var cl = Object.keys(m.rangs).filter(function(j){ return m.rangs[j] > 0; })
                 .sort(function(a,b){ return m.rangs[a] - m.rangs[b]; });
  var neuf = {}, precedent = null, courant = 0;
  cl.forEach(function(j){
    if (m.rangs[j] !== precedent){ courant++; precedent = m.rangs[j]; }
    neuf[j] = courant;
  });
  m.rangs = neuf;
}
function prochainRangLibre(m){
  var pris = Object.keys(m.rangs).map(function(k){ return m.rangs[k]; }).filter(function(r){ return r>0; });
  return pris.length ? Math.max.apply(null, pris) + 1 : 1;
}
function fermerPanneaux(){ panneauOuvert = null; motifRefus = null; }

document.addEventListener("click", function(evt){
  if (MIROIR) return;
  var o = evt.target.closest("[data-onglet]");
  if (o){
    E.onglet = o.getAttribute("data-onglet");
    fermerPanneaux(); epreuveOuverte = null; choixPreset = false;
    rendre(); window.scrollTo(0,0); return;
  }
  var b = evt.target.closest("[data-act]");
  if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  var a = b.getAttribute("data-act");
  if (a === "annuler"){ annuler(); return; }   // jamais empilé sur lui-même
  var avant = instantane();
  try { traiterClic(a, b); } finally { memoriser(avant, a); }
});

function traiterClic(a, b){
  var e = b.getAttribute("data-ep") ? ep(b.getAttribute("data-ep")) : null;
  var j, p, i, k, m, b2, champ, nom, c2, sans, blocage, arch;

  switch(a){
    case "exemple": chargerExemple(); return;
    case "onglet-rang": ongletRang = b.getAttribute("data-v"); break;

    case "joueur-ajoute":
      champ = document.getElementById("nouveau-joueur");
      nom = (champ.value||"").trim();
      if (!nom){ champ.focus(); return; }
      E.joueurs.push({ id:id(), nom:nom, couleur: PALETTE[E.joueurs.length % PALETTE.length] });
      champ.value = "";
      rendre();
      c2 = document.getElementById("nouveau-joueur"); if (c2) c2.focus();
      return;
    case "joueur-retire":
      j = trouverJoueur(b.getAttribute("data-j"));
      if (!j || !confirm("Retirer " + j.nom + " du tournoi ? Ses résultats seront effacés.")) return;
      E.joueurs = E.joueurs.filter(function(x){ return x.id !== j.id; });
      E.epreuves.forEach(function(x){
        x.participants = x.participants.filter(function(q){ return q !== j.id; });
        x.manches.forEach(function(mm){ delete mm.rangs[j.id]; reindexerRangs(mm); });
        delete x.affiliations[j.id];
        delete x.paris[j.id];
        Object.keys(x.affiliations).forEach(function(q){ if (x.affiliations[q] === j.id) delete x.affiliations[q]; });
        Object.keys(x.paris).forEach(function(q){ if (x.paris[q] === j.id) delete x.paris[q]; });
      });
      break;

    case "epreuve-ajoute":
      champ = document.getElementById("nouvelle-epreuve");
      nom = (champ.value||"").trim();
      if (!nom){ champ.focus(); return; }
      p = normaliserEpreuve({ id:id(), nom:nom });
      E.epreuves.push(p);
      champ.value = "";
      choixPreset = false; epreuveOuverte = p.id;
      break;
    case "ouvrir-preset": choixPreset = true; epreuveOuverte = null; break;
    case "fermer-preset": choixPreset = false; break;
    case "ajouter-preset":
      k = Math.max(1, Number(b.getAttribute("data-manches")) || 1);
      m = [];
      for (i=0;i<k;i++) m.push({ id:id(), rangs:{} });
      E.epreuves.push(normaliserEpreuve({
        id:id(), nom:b.getAttribute("data-nom"), icone:b.getAttribute("data-icone"),
        poids:Number(b.getAttribute("data-poids"))||1, teinte:b.getAttribute("data-teinte"), manches:m
      }));
      break;
    case "ouvrir-epreuve": epreuveOuverte = e.id; choixPreset = false; break;
    case "fermer-epreuve": epreuveOuverte = null; break;
    case "aller-jeu":
      E.onglet = "deroulement"; epreuveOuverte = null; choixPreset = false;
      rendre();
      c2 = document.getElementById("jeu-" + e.id);
      if (c2) c2.scrollIntoView({ behavior:"smooth", block:"start" });
      return;
    // blasonManuel : à partir d'ici, la reconnaissance par le nom se tait.
    case "ep-icone": e.icone = b.getAttribute("data-i"); e.image = ""; e.blasonManuel = true; break;
    case "ep-image-choisir":
      c2 = document.getElementById("img-" + e.id);
      if (c2) c2.click();
      return;
    case "ep-image-vider": e.image = ""; break;
    case "ep-retire":
      if (!e || !confirm("Supprimer « " + e.nom + " » et ses résultats ?")) return;
      E.epreuves = E.epreuves.filter(function(x){ return x.id !== e.id; });
      epreuveOuverte = null;
      break;
    case "ep-monte":
      i = E.epreuves.indexOf(e);
      if (i>0){ E.epreuves.splice(i,1); E.epreuves.splice(i-1,0,e); }
      break;
    case "ep-descend":
      i = E.epreuves.indexOf(e);
      if (i<E.epreuves.length-1){ E.epreuves.splice(i,1); E.epreuves.splice(i+1,0,e); }
      break;
    case "bareme-auto": e.baremeManuel = barmeAutoPour(Math.max(e.participants.length, E.joueurs.length, 2)); break;
    case "bareme-plus":
      b2 = (e.baremeManuel && e.baremeManuel.length) ? e.baremeManuel.slice() : barmeAutoPour(Math.max(E.joueurs.length,2));
      b2.push(0); e.baremeManuel = b2;
      break;
    case "bareme-moins":
      b2 = (e.baremeManuel||[]).slice();
      if (b2.length>1){ b2.pop(); e.baremeManuel = b2; }
      break;

    /* déclarations */
    case "declare-joue":
      j = b.getAttribute("data-j");
      delete e.affiliations[j];
      if (e.participants.indexOf(j) === -1) e.participants.push(j);
      // on ne peut pas parier sur soi-même
      if (e.paris[j] === j) delete e.paris[j];
      Object.keys(e.paris).forEach(function(q){ if (q === j && e.paris[q] === j) delete e.paris[q]; });
      fermerPanneaux();
      break;
    case "declare-vide":
      j = b.getAttribute("data-j");
      e.participants = e.participants.filter(function(q){ return q !== j; });
      e.manches.forEach(function(mm){ delete mm.rangs[j]; reindexerRangs(mm); });
      delete e.affiliations[j];
      delete e.paris[j];
      Object.keys(e.affiliations).forEach(function(q){ if (e.affiliations[q] === j) delete e.affiliations[q]; });
      Object.keys(e.paris).forEach(function(q){ if (e.paris[q] === j) delete e.paris[q]; });
      fermerPanneaux();
      break;
    case "ouvrir-porteur":
      j = b.getAttribute("data-j");
      panneauOuvert = (panneauOuvert && panneauOuvert.type==="porteur" && panneauOuvert.ep===e.id && panneauOuvert.j===j)
        ? null : { type:"porteur", ep:e.id, j:j };
      motifRefus = null;
      break;
    case "ouvrir-pari":
      j = b.getAttribute("data-j");
      panneauOuvert = (panneauOuvert && panneauOuvert.type==="pari" && panneauOuvert.ep===e.id && panneauOuvert.j===j)
        ? null : { type:"pari", ep:e.id, j:j };
      motifRefus = null;
      break;
    case "fermer-panneau": fermerPanneaux(); break;
    case "choisir-porteur":
      j = b.getAttribute("data-j"); p = b.getAttribute("data-p");
      blocage = blocageAffiliation(e, j, p);
      if (blocage){ motifRefus = { ep:e.id, j:j, texte:blocage.texte }; break; }
      e.participants = e.participants.filter(function(q){ return q !== j; });
      e.manches.forEach(function(mm){ delete mm.rangs[j]; reindexerRangs(mm); });
      Object.keys(e.affiliations).forEach(function(q){ if (e.affiliations[q] === j) delete e.affiliations[q]; });
      e.affiliations[j] = p;
      if (e.paris[j] === j) delete e.paris[j];
      fermerPanneaux();
      break;
    case "porteur-refus":
      j = b.getAttribute("data-j"); p = b.getAttribute("data-p");
      blocage = blocageAffiliation(e, j, p);
      motifRefus = { ep:e.id, j:j, texte: blocage ? blocage.texte : "" };
      break;
    case "choisir-pari":
      j = b.getAttribute("data-j"); p = b.getAttribute("data-p");
      if (j === p) break;
      e.paris[j] = p;
      fermerPanneaux();
      break;
    case "annuler-pari":
      delete e.paris[b.getAttribute("data-j")];
      fermerPanneaux();
      break;

    /* déroulement */
    case "statut":
      e.statut = b.getAttribute("data-val");
      if (e.statut === "terminee"){
        E.compteurFin = (E.compteurFin||0) + 1;
        e.rangFin = E.compteurFin;
        if (E.reglages.chronoActif && e.debutA && !e.finA) e.finA = Date.now();
      }
      if (e.statut === "en_jeu" && E.reglages.chronoActif) e.finA = 0;
      fermerPanneaux();
      break;
    case "lancer":
      if (E.reglages.affiliationObligatoire){
        sans = E.joueurs.filter(function(q){ return roleDans(e, q.id) === "absent" && !e.paris[q.id]; })
                        .map(function(q){ return q.nom; });
        if (sans.length && !confirm("Ces joueurs n'ont ni partie, ni porteur, ni pari et marqueront 0 :\n\n" +
            sans.join(", ") + "\n\nLancer quand même ?")) return;
      }
      e.statut = "en_jeu";
      if (E.reglages.chronoActif && !e.debutA) e.debutA = Date.now();
      fermerPanneaux();
      break;
    case "deverrouiller":
      if (!confirm("Rouvrir les déclarations ? Les rangs déjà saisis seront effacés.")) return;
      e.manches = [{ id:id(), rangs:{} }];
      e.statut = "declarations";
      e.debutA = 0; e.finA = 0;
      break;
    case "manche": mancheActive[e.id] = Number(b.getAttribute("data-k")); break;
    case "manche-plus":
      e.manches.push({ id:id(), rangs:{} });
      mancheActive[e.id] = e.manches.length - 1;
      break;
    case "manche-moins":
      if (e.manches.length <= 1) break;
      k = Number(b.getAttribute("data-k"));
      if (!confirm("Retirer la manche " + (k+1) + " et ses résultats ?")) return;
      e.manches.splice(k, 1);
      mancheActive[e.id] = Math.max(0, Math.min(k, e.manches.length - 1));
      break;
    case "manche-vider":
      k = Number(b.getAttribute("data-k"));
      if (e.manches[k]) e.manches[k].rangs = {};
      break;
    case "rang-suivant":
      j = b.getAttribute("data-j");
      m = e.manches[indexManche(e)];
      if (m.rangs[j]){ delete m.rangs[j]; reindexerRangs(m); }
      else m.rangs[j] = prochainRangLibre(m);
      break;

    /* suspense, récap, ligue */
    case "reveler":
      if (!confirm("Révéler le classement général à tout le monde ? Le sceau ne se remet pas tout seul.")) return;
      E.aveugleLeve = true;
      break;
    case "resceller": E.aveugleLeve = false; break;
    case "recap": ouvrirRecap(); return;
    case "archiver":
      if (!confirm("Verser le classement dans la ligue, puis effacer les résultats de la soirée ?\n\n" +
                   "Les joueurs et les jeux sont conservés pour la prochaine fois.")) return;
      if (!archiverSoiree()){ alert("Rien à archiver : ajoutez des joueurs d'abord."); return; }
      E.epreuves.forEach(function(x){
        x.statut = "a_venir"; x.participants = []; x.affiliations = {}; x.paris = {};
        x.manches = [{ id:id(), rangs:{} }]; x.rangFin = 0; x.debutA = 0; x.finA = 0;
      });
      E.compteurFin = 0; E.aveugleLeve = false;
      mancheActive = {};
      ongletRang = "ligue";
      break;
    case "archive-retire":
      if (!confirm("Retirer cette soirée de la ligue ?")) return;
      arch = lireArchives().filter(function(s){ return s.id !== b.getAttribute("data-a"); });
      ecrireArchives(arch);
      break;

    case "exporte": exporter(); return;
    case "importe": document.getElementById("fichier-import").click(); return;
    case "reinit":
      if (!confirm("Effacer entièrement la soirée en cours ? Les archives de ligue sont conservées.")) return;
      Stockage.effacer(CLE);
      E = etatVierge();
      fermerPanneaux(); epreuveOuverte = null; choixPreset = false; mancheActive = {};
      E.onglet = "reglages";
      break;
    default: return;
  }
  rendre();
}

document.addEventListener("change", function(evt){
  var el = evt.target;
  if (el.id === "fichier-import"){ importer(el); return; }
  if (MIROIR) return;
  var a = el.getAttribute ? el.getAttribute("data-act") : null;
  if (!a) return;
  var avant = instantane();
  try { traiterChangement(a, el); } finally { memoriser(avant, a); }
});

function traiterChangement(a, el){
  var e = el.getAttribute("data-ep") ? ep(el.getAttribute("data-ep")) : null;
  var j, r, b2, m;

  switch(a){
    case "ep-image": importerImage(el, e); return;
    case "ep-teinte": e.teinte = el.value; e.image = ""; e.blasonManuel = true; break;
    case "joueur-nom":
      j = trouverJoueur(el.getAttribute("data-j"));
      if (j) j.nom = el.value.trim() || j.nom;
      break;
    case "joueur-couleur":
      j = trouverJoueur(el.getAttribute("data-j"));
      if (j) j.couleur = el.value;
      break;
    case "ep-nom": e.nom = el.value.trim() || e.nom; break;
    case "ep-poids": e.poids = nombre(el.value); break;
    case "ep-cumul": e.cumul = el.value; break;
    case "ep-mode":
      e.mode = el.value;
      if (e.mode === "manuel" && (!e.baremeManuel || !e.baremeManuel.length))
        e.baremeManuel = barmeAutoPour(Math.max(e.participants.length, E.joueurs.length, 2));
      break;
    case "ep-bareme":
      r = Number(el.getAttribute("data-r"));
      b2 = (e.baremeManuel && e.baremeManuel.length) ? e.baremeManuel.slice() : barmeAutoPour(Math.max(E.joueurs.length,2));
      b2[r-1] = nombre(el.value);
      e.baremeManuel = b2;
      break;
    case "rang-select":
      j = el.getAttribute("data-j");
      m = e.manches[indexManche(e)];
      if (Number(el.value) > 0) m.rangs[j] = Number(el.value); else delete m.rangs[j];
      break;
    case "r-nom": E.nom = el.value.trim() || "Tournoi maison"; break;
    case "r-num": E.reglages[el.getAttribute("data-k")] = nombre(el.value); break;
    case "r-bool": E.reglages[el.getAttribute("data-k")] = el.checked; break;
    default: return;
  }
  rendre();
}

/* --- image personnalisée : recadrée en 128 px pour ne pas saturer le stockage --- */
function importerImage(input, e){
  var f = input.files && input.files[0];
  input.value = "";
  if (!f || !e) return;
  var avant = instantane();
  var url = URL.createObjectURL(f);
  var img = new Image();
  img.onload = function(){
    var T = 128, cv = document.createElement("canvas");
    cv.width = T; cv.height = T;
    var ctx = cv.getContext("2d");
    var cote = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width-cote)/2, (img.height-cote)/2, cote, cote, 0, 0, T, T);
    try { e.image = cv.toDataURL("image/jpeg", 0.82); } catch(err){ e.image = ""; }
    URL.revokeObjectURL(url);
    rendre();
    memoriser(avant, "ep-image");
  };
  img.onerror = function(){ URL.revokeObjectURL(url); alert("Image illisible. Essayez un PNG, un JPEG ou un WebP."); };
  img.src = url;
}

/* --- import / export --- */
function exporter(){
  var blob = new Blob([JSON.stringify(E, null, 2)], { type:"application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = (E.nom || "tourneo").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") +
               "-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}
function importer(input){
  var f = input.files && input.files[0];
  if (!f) return;
  var fr = new FileReader();
  var avant = instantane();
  fr.onload = function(){
    try {
      var o = JSON.parse(fr.result);
      if (!o || !Array.isArray(o.joueurs)) throw new Error("format");
      E = Object.assign(etatVierge(), o);
      E.reglages = Object.assign(reglagesDefaut(), o.reglages || {});
      E.epreuves = (o.epreuves||[]).map(normaliserEpreuve);
      fermerPanneaux(); epreuveOuverte = null; choixPreset = false; mancheActive = {};
      E.onglet = "classement";
      rendre();
      memoriser(avant, "importe");
    } catch(err){
      alert("Ce fichier n'est pas un tournoi exportable. Choisissez un JSON produit par « Exporter ».");
    }
  };
  fr.readAsText(f);
  input.value = "";
}

/* --- soirée d'exemple --- */
function chargerExemple(){
  if (E.joueurs.length && !confirm("Remplacer le contenu actuel par la soirée d'exemple ?")) return;
  E = etatVierge();
  ["Fred","Marie","Tommy","Sophie","Ludo","Ariane"].forEach(function(n,i){
    E.joueurs.push({ id:id(), nom:n, couleur:PALETTE[i % PALETTE.length] });
  });
  ["Mario Kart","Baby-foot","Catan","Dards","Super Smash Bros.","Quiz musical"].forEach(function(nom){
    PRESETS.forEach(function(f){
      f.jeux.forEach(function(g){
        if (g.nom !== nom) return;
        var m = [];
        for (var i=0;i<g.manches;i++) m.push({ id:id(), rangs:{} });
        E.epreuves.push(normaliserEpreuve({ id:id(), nom:g.nom, icone:g.icone, poids:g.poids, teinte:f.teinte, manches:m }));
      });
    });
  });
  fermerPanneaux(); epreuveOuverte = null; choixPreset = false; mancheActive = {};
  E.onglet = "tournoi";
  rendre();
}

/* ==========================================================================
   14. DÉMARRAGE
   ========================================================================== */
if (!MIROIR){
  document.getElementById("btn-annuler").addEventListener("click", annuler);
  document.getElementById("btn-tv").addEventListener("click", ouvrirTV);
  document.getElementById("btn-fenetre").addEventListener("click", function(){
    window.open(location.href.split("#")[0] + "#tv", "tourneo-tv", "width=1280,height=760");
  });
  document.getElementById("tv-fermer").addEventListener("click", fermerTV);
  document.getElementById("recap-fermer").addEventListener("click", function(){
    document.getElementById("recap").classList.remove("actif");
  });
  document.getElementById("recap-tel").addEventListener("click", function(){
    var a = document.createElement("a");
    a.href = document.getElementById("recap-img").src;
    a.download = (E.nom || "tourneo").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") +
                 "-" + new Date().toISOString().slice(0,10) + ".png";
    document.body.appendChild(a); a.click(); a.remove();
  });
  document.addEventListener("keydown", function(e){
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){ e.preventDefault(); annuler(); return; }
    if (e.key !== "Escape") return;
    if (document.getElementById("recap").classList.contains("actif"))
      document.getElementById("recap").classList.remove("actif");
    else fermerTV();
  });
  // Chronomètre : on ne redessine pas toute l'interface chaque seconde.
  setInterval(function(){
    if (!E.reglages.chronoActif) return;
    Array.prototype.forEach.call(document.querySelectorAll("[data-chrono]"), function(el){
      var x = ep(el.getAttribute("data-chrono"));
      if (x) el.textContent = chronoTexte(x);
    });
  }, 1000);
} else {
  document.body.classList.add("miroir");
  document.getElementById("tv-fermer").hidden = true;
}

document.getElementById("tv-prec").addEventListener("click", function(){ changerPanneau(-1); });
document.getElementById("tv-suiv").addEventListener("click", function(){ changerPanneau(1); });
document.getElementById("tv-pause").addEventListener("click", function(){
  tvPause = !tvPause;
  this.innerHTML = tvPause ? "&#9654;" : "&#10074;&#10074;";
  this.setAttribute("aria-label", tvPause ? "Reprendre la rotation" : "Mettre en pause");
  relancerProgres();
});
document.addEventListener("keydown", function(e){
  if (!document.getElementById("tv").classList.contains("actif")) return;
  if (e.key === "ArrowRight") changerPanneau(1);
  if (e.key === "ArrowLeft")  changerPanneau(-1);
});

window.addEventListener("storage", function(e){
  if (e.key !== CLE) return;
  charger();
  if (MIROIR) rendreTV(); else rendre();
});

if (!Stockage.dispo){
  var bandeau = document.getElementById("bandeau-stockage");
  bandeau.hidden = false;
  bandeau.innerHTML = "La sauvegarde automatique est bloquée dans cet aperçu — le tournoi vivra seulement le temps de l'onglet. " +
    "Téléchargez <code>tourneo.html</code> et ouvrez-le directement pour retrouver l'enregistrement au fil de la saisie. " +
    "En attendant, <strong>Réglages &#8594; Exporter</strong> conserve tout dans un fichier.";
}

charger();
if (MIROIR){ ouvrirTV(); } else { rendre(); }

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  navigator.serviceWorker.register("./sw.js").catch(function(){ /* servi sans cache hors ligne */ });
}
